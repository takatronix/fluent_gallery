<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>fluent_gallery</title>
<style>
  /* ==== v3「フォルダが主語」— 正本は docs/ui-v3.md。無彩色ダーク+アクセント1色+SVGアイコン ==== */
  :root {
    --bg:#0a0a0c; --side:#0e0f12; --panel:#14151a; --line:#232530; --hair:#1a1c24;
    --tx:#e8e9ec; --dim:#8b8e98; --faint:#5c5f6a;
    --acc:#4d9fff; --acc-soft:#4d9fff22; --ok:#6ee7a0;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--tx); overflow:hidden;
         font:13px/1.55 -apple-system,"SF Pro Text","Hiragino Sans",system-ui,sans-serif;
         display:grid; grid-template-columns:var(--sidew, 218px) 1fr; }
  ::selection { background:var(--acc-soft); }
  svg.ic { vertical-align:-2.5px; flex:none; }
  button { font:12.5px inherit; color:var(--dim); background:none; border:1px solid var(--line);
           border-radius:8px; padding:6px 12px; cursor:pointer; display:inline-flex; gap:6px;
           align-items:center; transition:color .15s, border-color .15s, background .15s; }
  button:hover { color:var(--tx); border-color:#3a3d4a; }
  button.pri { color:#fff; background:var(--acc); border-color:transparent; font-weight:600; }
  button.pri:hover { filter:brightness(1.1); }
  button.ghost { border-color:transparent; }
  button.on { color:var(--ok); border-color:#6ee7a055; }
  input, select { background:#0d0e12; color:var(--tx); border:1px solid var(--line);
                  border-radius:8px; padding:6px 11px; font-size:12.5px; outline:none; }
  input:focus { border-color:var(--acc); }

  /* ---- サイドバー ---- */
  aside { background:var(--side); border-right:1px solid var(--hair); padding:14px 10px 16px;
          overflow-y:auto; user-select:none; display:flex; flex-direction:column; position:relative; }
  /* サイドバー幅のドラッグつまみ(右端)。掴むと出る・普段は透明 */
  #sideresize { position:fixed; top:0; bottom:0; width:7px; cursor:col-resize; z-index:50;
                left:calc(var(--sidew, 218px) - 3px); }
  #sideresize:hover, #sideresize.on { background:#7aa2f744; }
  .brand { font-size:13.5px; font-weight:700; padding:2px 10px 10px; }
  .brand small { color:var(--faint); font-weight:400; margin-left:6px; }
  .sec { font-size:10px; font-weight:600; letter-spacing:.09em; color:var(--faint);
         padding:16px 10px 4px; text-transform:uppercase; display:flex; align-items:center; }
  .sec .add { margin-left:auto; cursor:pointer; padding:0 4px; border-radius:5px; display:flex; }
  .sec .add:hover { color:var(--tx); background:#ffffff0c; }
  .nav { display:flex; align-items:center; gap:8px; padding:5px 10px; border-radius:7px;
         color:var(--dim); cursor:pointer; font-size:12.5px; white-space:nowrap; }
  .nav:hover { background:#ffffff08; color:var(--tx); }
  .nav.on { background:var(--acc-soft); color:var(--tx); }
  .nav .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:76px; }
  .nav .n { margin-left:auto; font-size:10px; color:var(--faint); font-variant-numeric:tabular-nums;
            padding-left:6px; flex:none; max-width:46%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav .st { margin-left:auto; flex:none; display:flex; align-items:center; color:var(--ok); }
  .nav .del { display:none; margin-left:4px; color:var(--faint); }
  .nav:hover .del { display:inline-flex; }
  .nav .del:hover { color:var(--tx); }

  /* ---- メイン ---- */
  main { display:flex; flex-direction:column; overflow:hidden; }
  .top { display:flex; gap:8px; align-items:center; padding:10px 16px 8px; flex-wrap:wrap;
         border-bottom:1px solid var(--hair); }
  .search { flex:0 1 280px; min-width:170px; display:flex; align-items:center; gap:8px;
            background:#0d0e12; border:1px solid var(--line); border-radius:8px;
            padding:6px 12px; color:var(--faint); }
  .search input { background:none; border:none; padding:0; width:100%; }
  .fchip { font-size:11.5px; padding:5px 13px; border-radius:999px; } /* 丸く(2026-09-03指示) */
  .fchip.on { color:var(--tx); border-color:var(--acc); background:var(--acc-soft); }
  /* モードON中はページ背景もうっすら色づく(今どのモードで見ているか一目で分かる) */
  body.f-clean { background: radial-gradient(1200px 500px at 50% -100px, #113d2422, transparent), var(--bg); }
  body.f-safe { background: radial-gradient(1200px 500px at 50% -100px, #10365522, transparent), var(--bg); }
  body.f-clean.f-safe { background:
      radial-gradient(900px 420px at 30% -100px, #113d2422, transparent),
      radial-gradient(900px 420px at 70% -100px, #10365522, transparent), var(--bg); }
  /* 権利クリーン/セーフは意味が重要なチップ: ON時に色+太字で強調 */
  #fc_clean.on { color:#6ee7a0; border-color:#6ee7a0; background:#6ee7a01c; font-weight:700; }
  #fc_safe.on { color:#7ec8ff; border-color:#7ec8ff; background:#7ec8ff1c; font-weight:700; }
  .sp { flex:1; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; padding:0 16px; max-height:0; overflow:hidden;
           transition:max-height .25s ease, padding .25s ease; }
  .chips.open { max-height:220px; padding:8px 16px 2px; overflow-y:auto; }
  #chipsbtn .badge { background:var(--acc); color:#fff; border-radius:99px; font-size:10px;
                     padding:0 6px; margin-left:2px; }
  .chip { font-size:11px; padding:3px 10px; border-radius:999px; border:1px solid var(--hair);
          background:none; color:var(--faint); cursor:pointer; transition:all .15s; }
  .chip:hover { color:var(--tx); border-color:#3a3d4a; }
  .chip.on { color:var(--tx); border-color:var(--acc); background:var(--acc-soft); }
  .chip small { opacity:.6; margin-left:3px; }
  .sub { font-size:11.5px; color:var(--faint); }

  /* ---- ビューヘッダ(今いる場所の説明+操作) ---- */
  #viewhead { display:none; margin:10px 16px 0; background:var(--panel); border:1px solid var(--line);
              border-radius:12px; padding:12px 16px; }
  #viewhead .row1 { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #viewhead .ttl { font-size:14px; font-weight:700; display:flex; gap:8px; align-items:center; }
  #viewhead .frow { display:flex; gap:8px; align-items:center; margin-top:8px; }
  #viewhead .frow .lbl { width:76px; text-align:right; flex:none; font-size:11px; color:var(--faint); }
  #viewhead .goal { flex:1; min-width:220px; }
  #viewhead .lbl { font-size:11px; color:var(--faint); }
  #viewhead .last { font-size:11px; color:var(--faint); margin-top:9px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  #viewhead .last b { color:var(--dim); }
  /* 自動収集はボタンでなくスイッチ(▶今すぐ1回とは役割が違うことを見た目で示す) */
  .switch { display:inline-flex; gap:7px; align-items:center; cursor:pointer; font-size:12px;
            color:var(--dim); border:1px solid transparent; padding:6px 10px; border-radius:8px; }
  .switch:hover { color:var(--tx); }
  .switch .track { width:30px; height:17px; border-radius:99px; background:#2a2d38; position:relative;
                   transition:background .2s; flex:none; }
  .switch .track::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px;
                          border-radius:99px; background:#8b8e98; transition:transform .2s, background .2s; }
  .switch.on { color:var(--ok); }
  .switch.on .track { background:#1d4230; }
  .switch.on .track::after { transform:translateX(13px); background:var(--ok); }
  /* 検索元チェック(うるさくない小チップ) */
  .engchip { font-size:10.5px; padding:3px 11px; border-radius:99px; border:1px solid var(--hair);
             color:var(--faint); cursor:pointer; display:inline-flex; gap:5px; align-items:center;
             transition:all .15s; }
  .engchip svg { opacity:.55; flex:none; }
  /* ブーストの怪しいアイコン(2026-09-03指示「金と薬」): OFF=モノクロ、ON=フルカラー+金色の怪しい光 */
  .boost-glyph { font-size:12px; line-height:1; filter:grayscale(1); opacity:.55; letter-spacing:-2px; }
  .switch.on .boost-glyph { filter:none; opacity:1; text-shadow:0 0 9px #e5c07baa; }
  .engchip .eng-glyph { font-size:12px; line-height:1; filter:grayscale(1); opacity:.5; }
  .engchip.on .eng-glyph { filter:none; opacity:1; }
  .engchip:hover { color:var(--dim); border-color:var(--line); }
  .engchip.on { color:var(--tx); border-color:var(--acc); background:#4d9fff14; }
  .engchip.on svg { opacity:1; color:var(--acc); }

  #crawlbar { display:none; margin:8px 16px 0; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:12px; color:var(--dim); }
  #crawlbar.show { display:flex; }
  /* フォルダパネルは1行に畳む(サムネの場所を食わない)。⌄で展開 */
  #viewhead .details { display:none; }
  #viewhead.open .details { display:block; }
  /* 取り込みは呼んだ時だけの中央オーバーレイ(画面に居座らない) */
  #ovl { position:fixed; inset:0; background:#00000090; z-index:18; display:none;
         align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  #ovl.show { display:flex; animation:lbin .18s ease; }
  #ingestpanel { width:min(680px, 92vw); background:var(--panel); border:1px solid var(--line);
                 border-radius:14px; padding:16px 18px; font-size:12px; color:var(--dim);
                 box-shadow:0 24px 70px #000b; }
  .pulse { display:inline-block; width:7px; height:7px; border-radius:99px; background:var(--acc);
           margin-right:8px; animation:pulse 1.2s ease infinite; }
  @keyframes pulse { 50% { opacity:.3; transform:scale(.7); } }

  /* ---- グリッド: クリック=開く / ◯=選択 ---- */
  .gridwrap { flex:1; overflow-y:auto; padding:10px 16px 90px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--cell,168px),1fr)); gap:6px; }
  .grid.fit img { object-fit:contain; }
  .cell { position:relative; aspect-ratio:1; border-radius:6px; overflow:hidden; cursor:pointer;
    /* 画面外セルはレイアウト/描画/ラスタメモリごとスキップ(数千枚でも軽い)。サイズはヒントで確保 */
    content-visibility:auto; contain-intrinsic-size:var(--cell,168px) var(--cell,168px);
          background:var(--panel); opacity:0; transform:translateY(14px) scale(.97);
          transition:opacity .45s ease, transform .5s cubic-bezier(.2,.9,.3,1); }
  .cell.in { opacity:1; transform:none; }
  .cell img { width:100%; height:100%; object-fit:cover; display:block; }
  .cell::after { content:''; position:absolute; inset:0; box-shadow:inset 0 0 0 1px #ffffff0d;
                 border-radius:6px; pointer-events:none; }
  .cell .ck { position:absolute; top:6px; left:6px; width:22px; height:22px; border-radius:99px;
              border:1.5px solid #ffffffb0; background:#00000038; cursor:pointer; opacity:0;
              transition:opacity .12s, background .12s, border-color .12s; z-index:2;
              display:flex; align-items:center; justify-content:center; color:transparent; }
  @media (hover:hover) { .cell:hover .ck { opacity:1; } }
  body.selmode .ck { opacity:1; }
  .cell.sel .ck { opacity:1; background:var(--acc); border-color:var(--acc); color:#fff; }
  .cell.sel { outline:2px solid var(--acc); outline-offset:-2px; }
  .cell.sel img { transform:scale(.94); border-radius:4px; transition:transform .15s ease; }
  .cell .badge { position:absolute; top:7px; right:7px; z-index:2; color:#aeb4c2; opacity:0;
                 cursor:pointer; filter:drop-shadow(0 1px 3px #000c);
                 transition:opacity .12s, color .12s, transform .12s; }
  @media (hover:hover) { .cell:hover .badge { opacity:.9; } }
  .cell .badge:hover { transform:scale(1.25); }
  .cell .badge.on { opacity:1; color:#f2c14e; }
  .facebox { position:fixed; z-index:45; border:2px solid #ffffff90; border-radius:9px; cursor:pointer;
             transition:border-color .12s, box-shadow .12s; }
  .facebox:hover { border-color:var(--acc); }
  .facebox.on { border-color:#f2c14e; box-shadow:0 0 14px #f2c14e66; }
  .tag.ptag { color:#f2c14e; border-color:#f2c14e55; } /* 顔ID(本人確認済み)タグは金色 */
  .cell .costb { position:absolute; top:5px; left:5px; z-index:1; font-size:8px; font-weight:600;
                 background:#1a160abb; color:#e5c07b88; border-radius:99px; padding:0 5px; }
  .cell .rclean { position:absolute; bottom:6px; right:6px; z-index:1; width:17px; height:17px;
                  border-radius:50%; background:#123524d9; color:#6ee7a0; display:flex;
                  align-items:center; justify-content:center; box-shadow:0 1px 3px #000a; }
  .cell .newb { position:absolute; bottom:6px; left:6px; z-index:1; font-size:9px; font-weight:700;
                letter-spacing:.05em; color:#fff; background:var(--acc); border-radius:5px;
                padding:1px 6px; box-shadow:0 1px 5px #0009; }
  .cell .cap { position:absolute; inset-inline:0; bottom:0; padding:18px 8px 5px; font-size:10.5px;
               color:#dfe2e8; background:linear-gradient(transparent,#000b); opacity:0;
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:opacity .2s; }
  @media (hover:hover) { .cell:hover .cap { opacity:1; } }
  .empty { grid-column:1/-1; text-align:center; color:var(--faint); padding:80px 20px; line-height:2; }
  .empty .big { opacity:.35; margin-bottom:6px; }
  .cell.drop { animation:dropIn .7s cubic-bezier(.2,1.5,.3,1); }
  @keyframes dropIn {
    0% { opacity:0; transform:translateY(-70px) scale(.5) rotate(-6deg); }
    60% { opacity:1; transform:translateY(5px) scale(1.03) rotate(1.5deg); }
    100% { opacity:1; transform:none; } }
  .cell.drop::before { content:''; position:absolute; inset:0; border-radius:6px; z-index:2; pointer-events:none;
    box-shadow:0 0 0 2px var(--acc), 0 0 26px var(--acc-soft); animation:dropGlow 1.8s ease forwards; }
  @keyframes dropGlow { from { opacity:1; } to { opacity:0; } }

  /* ---- 選択バー / 量産パネル ---- */
  #selbar { position:fixed; bottom:14px; left:calc(218px + 16px); right:16px; z-index:12;
            display:none; align-items:center; gap:8px; flex-wrap:wrap;
            background:#16171de8; border:1px solid var(--line); border-radius:12px;
            backdrop-filter:blur(16px); padding:9px 14px; box-shadow:0 12px 40px #000a; }
  #selbar.show { display:flex; }
  #selbar .cnt { font-size:12.5px; font-weight:600; }
  #genpanel { display:none; position:fixed; bottom:74px; left:calc(218px + 16px); right:16px; z-index:12;
              background:#16171de8; border:1px solid var(--line); border-radius:12px;
              backdrop-filter:blur(16px); padding:10px 14px; box-shadow:0 12px 40px #000a; }
  #genpanel .row1 { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  /* ---- ライトボックス ---- */
  #lb { position:fixed; inset:0; background:#000000e6; display:none; z-index:20; cursor:zoom-out;
        align-items:center; justify-content:center; flex-direction:column; overflow:hidden;
        backdrop-filter:blur(12px); }
  #lb.show { display:flex; animation:lbin .22s ease; }
  @keyframes lbin { from { opacity:0; } }
  #lb img#lbimg { max-width:94vw; max-height:74vh; border-radius:8px; box-shadow:0 24px 70px #000;
        cursor:zoom-out; animation:lbimg .3s cubic-bezier(.2,.9,.3,1); transition:filter .18s ease;
        touch-action:none; user-select:none; -webkit-user-drag:none;
        object-fit:contain; } /* 箱と中身の縦横比が食い違っても絶対に引き伸ばさない(アスペクト崩れの構造的封じ 2026-09-03) */
  @keyframes lbimg { from { transform:scale(.92); opacity:.5; } }
  #lbinfo { position:absolute; top:14px; left:14px; z-index:2; max-width:320px; cursor:default;
            background:#000000b8; border:1px solid #ffffff1a; border-radius:10px;
            backdrop-filter:blur(10px); padding:8px 12px; font-size:11.5px; line-height:1.6; color:#c9cdd6; }
  #lbinfo a { color:#8ab8ff; text-decoration:none; }
  #lbinfo a:hover { text-decoration:underline; }
  #lbbar { display:flex; gap:6px; align-items:center; padding:11px 4px 0; cursor:default; flex-wrap:wrap; justify-content:center; }
  #lbbar button { background:#ffffff0a; }
  #lb.editing #edbtn { color:var(--acc); border-color:var(--acc); background:var(--acc-soft); }
  #lbmeta { max-width:88vw; font-size:11.5px; color:var(--dim); text-align:center; line-height:1.7;
            padding:6px 0; cursor:default; }
  #lbmeta .tag { display:inline-block; background:#ffffff0c; border-radius:99px; padding:0 9px;
                 margin:1px 2px; font-size:10.5px; color:var(--dim); }
  #lb.imm #lbbar, #lb.imm #lbmeta, #lb.imm #editpanel, #lb.imm #lbinfo { display:none; }
  #lb.imm img#lbimg { max-width:100vw; max-height:100vh; border-radius:0; box-shadow:none; }
  #lb.imm { background:#000; backdrop-filter:none; }
  #editpanel { display:none; cursor:default; background:#14151ae8; border:1px solid var(--line);
               border-radius:14px; backdrop-filter:blur(14px); padding:12px 16px; margin-top:8px;
               width:min(700px, 94vw); box-shadow:0 16px 46px #000a; }
  #lb.editing #editpanel { display:block; animation:lbin .2s ease; }
  #editpanel .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:6px 0; }
  #editpanel label { font-size:11px; color:var(--faint); width:50px; text-align:right; }
  #editpanel input[type=range] { flex:1; min-width:110px; accent-color:var(--acc); padding:0; background:none; border:none; }
  #editpanel .val { font-size:10.5px; color:var(--dim); width:30px; font-variant-numeric:tabular-nums; }
  .fxchip { font-size:11px; padding:3px 11px; border-radius:999px; border:1px solid var(--line);
            color:var(--dim); cursor:pointer; transition:all .15s; }
  .fxchip:hover { color:var(--tx); border-color:var(--acc); }
  #edhist { font-size:10.5px; color:var(--faint); }

  #toast { position:fixed; bottom:80px; left:50%; transform:translate(-50%, 16px); opacity:0;
           background:#1d1f27f0; border:1px solid var(--line); color:var(--tx); padding:9px 20px;
           border-radius:999px; font-size:12.5px; z-index:30; box-shadow:0 10px 30px #000a;
           transition:all .25s ease; pointer-events:none; }
  #toast.show { transform:translate(-50%, 0); opacity:1; }

  @media (max-width: 780px) {
    body { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    #sideresize { display:none; }
    aside { flex-direction:row; gap:2px; overflow-x:auto; border-right:none; padding:8px 10px;
            border-bottom:1px solid var(--hair); align-items:center; }
    .brand, .sec, #ai_activity { display:none; }
    .nav { flex:none; }
    .nav .n { display:none; }
    .grid { grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:4px; }
    #selbar, #genpanel { left:10px; right:10px; }
  }
  /* iOS風スクロールバー: 細い丸棒・トラック透明(2026-09-03指示) */
  * { scrollbar-width: thin; scrollbar-color: #ffffff2e transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ffffff24; border-radius: 99px;
                              border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #ffffff4a; border: 2px solid transparent;
                                    border-radius: 99px; background-clip: content-box; }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* ホバーで「ひゅん」と少し寄る(実況ストリップは小さいので強め・グリッドは控えめ) */
  #cr_strip img { transition:transform .16s cubic-bezier(.2,1.6,.3,1); }
  #cr_strip img:hover { transform:scale(1.5); }
  /* カーソル位置のセルが「やさしく手前に浮く」(拡大カーソルでなくアニメで応える 2026-09-03) */
  /* 1.5倍はメニューに被って使いにくかった→1.15倍に(2026-09-03)。80ms遅延で素通り時のバタつき防止 */
  .cell { transition: transform .16s ease-out, box-shadow .16s ease-out; }
  .cell:hover { transform: scale(1.15); z-index: 5; box-shadow: 0 8px 26px #000a;
                transition: transform .22s cubic-bezier(.2,1.25,.3,1) .06s, box-shadow .22s ease .06s; }
  /* 選択作業中(1枚でも選択がある間)はホバー拡大を止め、チェックを正確に押せるようにする */
  body.selmode .cell:hover { transform: none; box-shadow: none; }
  /* 高密度モード(セル≤110px): 数百セルの個別アニメは主スレッドを殺すので演出を軽量化 */
  body.dense .cell { transition: none; }
  body.dense .cell:hover { transform: none; box-shadow: none; }
  body.dense .cell img { transition: none; }
  /* D&D: 落とせる場所のハイライト */
  .nav.dropon { outline:1px dashed #7aa2f7; background:#7aa2f722; }
</style>

<aside id="side">
  <div id="sideresize" title="ドラッグで幅を変える(ダブルクリックで既定に戻す)"></div>
  <div class="brand">fluent_gallery</div>
  <div id="nav_lib"></div>

  return r.json(); }
const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function toast(m, actLabel, actFn) {
  const t = $('toast');
  t.innerHTML = m + (actLabel ? ` <b style="cursor:pointer; margin-left:10px; color:var(--acc)" onclick="toastAct()">${actLabel}</b>` : '');
  t.style.pointerEvents = actLabel ? 'auto' : 'none';
  window._toastFn = actFn;
  t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), actLabel ? 6500 : 2800);
}
function toastAct() { const f = window._toastFn; window._toastFn = null; $('toast').classList.remove('show'); if (f) f(); }

function ic(name, size = 15) {
  return `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[name] || ''}</svg>`;
}

// ================= 状態モデル(憲法): loc = 今いる場所 =================
// {type:'lib'|'folder'|'source'|'dataset'|'search'|'new', key, criteria}
let loc = {type: 'lib', key: 'all', criteria: {}};
let prevLoc = null; // 検索から戻る先
let items = [], total = 0, sel = new Set(), lastCk = -1;
let chipFilters = {tag: '', scene: '', subject: '', style: '', gender: '', framing: '', age_group: '', people_count: '', animal: ''};
let fchips = {origin: '', q8: false, safe: false, clean: false};
let albumsCache = [], facetsCache = null;

const LIB = [
  {key: 'all', icon: 'img', label: 'すべて', criteria: {}},
  {key: 'keep', icon: 'star', label: 'お気に入り', criteria: {keep: '1'}},
  {key: 'novlm', icon: 'circle', label: '未属性', criteria: {vlm_: 'none'}},
];

function params(extra) {
  const base = {...(loc.criteria || {})};
  const o = {
    q: loc.type === 'search' ? $('q').value.trim() : '',
    sort: $('sort').value,
    origin: fchips.origin, nsfw: fchips.safe ? '0' : '', min_quality: fchips.q8 ? 8 : 0,
    rights: fchips.clean ? 'clean' : '',
    seg: fchips.seg ? '1' : '',
    tag: chipFilters.tag, scene: chipFilters.scene, subject: chipFilters.subject, style: chipFilters.style,
    gender: chipFilters.gender, framing: chipFilters.framing, age_group: chipFilters.age_group,
    people_count: chipFilters.people_count, animal: chipFilters.animal,
    watermark: fchips.nowm ? '0' : '',
  };
  return new URLSearchParams({...base, ...Object.fromEntries(Object.entries(o).filter(([, v]) => v !== '' && v !== 0)), ...extra});
}

// URL同期(コピペで同じ画面)
function syncHash() {
  const o = {t: loc.type, k: loc.key || ''};
  if (loc.type === 'search') o.q = $('q').value.trim();
  for (const [k, v] of Object.entries(fchips)) if (v) o['f_' + k] = typeof v === 'boolean' ? '1' : v;
  for (const [k, v] of Object.entries(chipFilters)) if (v) o['c_' + k] = v;
  if ($('lb').classList.contains('show') && items[lbIdx]) o.img = items[lbIdx].sha1;
  history.replaceState(null, '', '#' + new URLSearchParams(o).toString());
}

// ---- 移動(全ナビはここを通る) ----
async function go(next, opts = {}) {
  if (loc.type === 'search' && next.type !== 'search') $('q').value = '';
  loc = next;
  clearSel();
  closeIngest(); // 場所を移動したら浮きパネルは閉じる(邪魔問題)
  $('genpanel').style.display = 'none';
  if (!opts.keepChips) { chipFilters = {tag: '', scene: '', subject: '', style: '', gender: '', framing: '', age_group: '', people_count: '', animal: ''}; }

function onSearch() {
  const v = $('q').value.trim();
  // いた場所の条件(フォルダのsource等)を引き継いで「その中を」検索する。全体は検索ヘッダのボタンで広げる
  if (v && loc.type !== 'search') { prevLoc = loc;
    go({type: 'search', key: prevLoc.key || '', criteria: {...(prevLoc.criteria || {})}}, {keepChips: true}); }
  else if (!v && loc.type === 'search') { go(prevLoc || {type: 'lib', key: 'all', criteria: {}}); }
  else if (loc.type === 'search') reload();
}

function cycleSort() {

async function nlSearch() {
  const text = $('q').value.trim();
  if (!text) return;
  toast('AIが検索条件に翻訳中…');
  try {
    const r = await j('/api/nlq', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})});
    if (loc.type !== 'search') { prevLoc = loc; loc = {type: 'search', key: prevLoc.key || '', criteria: {...(prevLoc.criteria || {})}}; }
    fchips.origin = r.origin || '';
    fchips.q8 = (r.min_quality | 0) >= 8;
    for (const k of ['animal', 'gender', 'age_group', 'framing', 'scene', 'subject', 'style'])
      chipFilters[k] = r[k] || '';
    $('fc_real').classList.toggle('on', fchips.origin === 'real');
    $('fc_synth').classList.toggle('on', fchips.origin === 'synthetic');
    $('fc_q8').classList.toggle('on', fchips.q8);
    $('q').value = r.q || '';
    renderNav(); renderViewhead();
    await reload(true);
    const parts = [r.q, r.origin && (r.origin === 'real' ? '実写' : '生成'), r.animal, r.gender, r.age_group, r.framing, r.scene, r.style]
      .filter(Boolean).join(' · ');
    toast(`解釈: ${parts || text} — ${total}枚`);
    refreshFacets();
  } catch (e) { toast('翻訳できず素の検索: ' + e.message); onSearch(); }
}

function buildTree(list) {
  const root = {f: {}, items: []};
  for (const it of list) {
    let n = root;
    for (const part of (it.folder || '').split('/').filter(Boolean)) n = n.f[part] ??= {f: {}, items: []};
    n.items.push(it);
  }
  return root;
}
function treeHtml(node, item, depth = 0, key = '') {
  let h = '';
  for (const name of Object.keys(node.f).sort()) {
    const k = key + '/' + name, open = !folded.has(k);
    h += `<div class="nav" style="padding-left:${10 + depth * 13}px" onclick="toggleFold('${k.replace(/'/g, "\\'")}')">
      ${ic(open ? 'chevD' : 'chevR', 13)}<span class="nm" style="color:var(--faint)">${esc(name)}</span>
      <span class="del" title="この中に新規フォルダを作る" onclick="event.stopPropagation(); newInFolder('${k.slice(1).replace(/'/g, "\\'")}')">${ic('plus', 12)}</span></div>`;
    if (open) h += treeHtml(node.f[name], item, depth + 1, k);
  }
  return h + node.items.map(it => item(it, depth)).join('');
}
function splitPath(s) {
  const parts = s.split('/').map(x => x.trim()).filter(Boolean);
  const name = parts.pop() || '';
  return {folder: parts.join('/'), name};
}

  ev.dataTransfer.effectAllowed = 'move';

async function dropShas(ev, source) {
  ev.preventDefault();
  ev.currentTarget.classList.remove('dropon');
  let shas = [];
  try { shas = JSON.parse(ev.dataTransfer.getData('text/shas') || '[]'); } catch (e) {}
  if (!shas.length || !source) return;
  try {
    const r = await j('/api/move', {method: 'POST', body: JSON.stringify({shas, source})});
    toast(`${r.moved}枚を「${source.replace(/^crawl:/, '')}」へ移動しました`);
    sel.clear(); refreshFacets(); loadAlbums(); reload();
  } catch (e) { toast('❌ 移動失敗: ' + e.message); }
}

const JPY_RATE = 150;
function fmtCost(tok, usd) {
  const m = localStorage.getItem('fg_costmode') || 'usd';

// 1回の収集の推定コスト(トークン表示 2026-09-03指示)。💰=Claude目利き実測~1.1k tok/検査。
// 採用率は前回実績(無ければ15%)で割り戻す
function crawlCostEst(a) {
  if (!a?.agent?.boost) return '(無料)';
  const batch = a.agent?.batch || 30;
  const n = Math.max(1, Math.min(batch, Math.max(batch, (a.agent?.target || 200) - (a.count || 0))));
  const pass = Math.min(0.5, Math.max(0.05, a.last_run?.pass_rate || 0.15));
  const tok = (n / pass) * 1100 + 7000;
  const usd = (n / pass) * judgeRate(a) + 0.02; // 目利き単価はモデル連動+クエリ生成Claude約2¢
  return `(推定${fmtCost(tok, usd)})`;
}

// 「見てない間に来た分」= 前回このフォルダを開いた時刻より新しい収蔵にNEW
let seenMap = JSON.parse(localStorage.getItem('fg_seen') || '{}');
let prevSeen = 0;
function seenKey(a) { return a ? 'src:' + (a.criteria?.source || a.name) : 'src:' + (loc.criteria?.source || loc.key || ''); }
// ================= ライトボックス表示の単一責任者(状態機械 2026-09-03全面整理) =================
// img#lbimg の src と表示サイズを書けるのはこのモジュールだけ。他は絶対に触らない(触ると今日の退行祭りが再演される)。
// 状態: gen(世代=画像が変わるたび++、遅延応答は世代不一致で全部捨てる) / tier(手元の最良: thumb→pv→full、render=編集焼き)
// サイズ規則: 通常=ビューポートへアスペクトフィット(小原本も拡大)、編集レンダ=自然寸法(クロップで比率が変わるため)
const lbView = {
  gen: 0, sha: null, tier: null, edited: false,
  // 表示箱。nw/nh=0で解除(自然寸法モード)
  box(nw, nh) {
    const img = $('lbimg');
    if (!nw || !nh) { img.removeAttribute('width'); img.removeAttribute('height'); return; }
    const ar = nw / nh;
    let bw = Math.min(innerWidth * .94, innerHeight * .74 * ar), bh = bw / ar;
    if (bh > innerHeight * .74) { bh = innerHeight * .74; bw = bh * ar; }
    img.width = Math.round(bw);
    img.height = Math.round(bh);
  },
  // 唯一のsrc書き込み口。デコード完了後に差し替える=空白フレームを出さない
  async apply(gen, url, tier, nw, nh) {
    if (gen !== this.gen) return;
    const pre = new Image();
    pre.src = url;
    try { if (pre.decode) await pre.decode(); } catch (e) {}
    if (gen !== this.gen) return;
    const img = $('lbimg');
    this.box(nw === undefined ? pre.naturalWidth : nw, nh === undefined ? pre.naturalHeight : nh);
    img.dataset.tier = tier;
    this.tier = tier;
    img.src = url;
  },
  // 新しい画像: 箱は最初から最終サイズで確保し、サムネ→プレビュー→原寸を届いた順に同じ箱へ流し込む
  show(it, dir, bust) {
    const gen = ++this.gen;
    this.sha = it.sha1; this.edited = false; this.tier = null;
    $('lbimg').dataset.tier = '';
    this.box(it.w, it.h);
    const pvUrl = '/preview/' + it.sha1 + (bust ? '?t=' + Date.now() : '');
    const probe = new Image();
    probe.src = pvUrl;
    if (probe.complete) this.apply(gen, pvUrl, 'pv');
    else {
      // preview未着の間は正しいサムネ(開き直し=即/送り=150ms猶予: 先読みhitなら無傷)
      const t = setTimeout(() => { if (gen === this.gen && this.tier === null) this.apply(gen, '/thumb/' + it.sha1, 'thumb', it.w, it.h); },
                           dir ? 150 : 0);
      probe.onload = () => { clearTimeout(t); this.apply(gen, pvUrl, 'pv'); };
      probe.onerror = () => { clearTimeout(t); this.apply(gen, '/thumb/' + it.sha1, 'thumb', it.w, it.h); };
    }
    const full = new Image();
    full.src = '/img/' + it.sha1;
    full.onload = () => { if (gen === this.gen && !this.edited) this.apply(gen, full.src, 'full'); };
  },
  // 編集/マスク焼きレンダ(自然寸法)
  render(url) {
    this.edited = true;
    return this.apply(this.gen, url, 'render', 0, 0);
  },
};
let rgen = 0; // reload世代: ナビ連打時に遅い古の応答が新しい場所を上書きする追い越し事故の防止
async function reload(flip) {
  const g = ++rgen;

    const list = await j('/api/trash');

    items = list.map(e => ({...e, _trash: true}));
    total = items.length;
    render(true);
    $('n_trash').textContent = total || '';
    syncHash();
    return;
  }
  if (loc.type === 'folder' || loc.type === 'source') {
    const k = seenKey();
    prevSeen = seenMap[k] || 0;
    seenMap[k] = Date.now() / 1000;
    localStorage.setItem('fg_seen', JSON.stringify(seenMap));
    renderSide(); // +Nバッジを既読化
  } else prevSeen = 0;
  const r = await j('/api/images?' + params({limit: 200, offset: 0}));
  if (g !== rgen) return; // 追い越された(すでに別の場所へ移動済み)
  items = r.items; total = r.total;

let vStart = 0, vEnd = 0;
function cellPitch() { // 1行の高さ(セルは正方形: 幅=カラム幅、gap6)
  const c = $('grid').children[0];

  const buf = visRows; // 上下1画面分のバッファ
  const ns = Math.min(items.length, Math.max(0, Math.floor(rel / ch) - buf) * n);
  const ne = Math.min(items.length, (Math.floor(rel / ch) + visRows + buf) * n);

  if (!force && Math.abs(ns - vStart) < (buf * n) / 2 && Math.abs(ne - vEnd) < (buf * n) / 2) return;
  // 差分更新: 窓が重なっていれば増減した分だけ足し引き(denseで窓全体を作り直すと固まる 2026-09-03)。
  // reflow=itemsは同じでサイズだけ変わった時(俯瞰⇄標準)。生き残るセルはDOMごと残す=
  // 全再構築でデコード待ちのtint背景が全面に見える「切替フラッシュ」の根治(2026-09-03指摘)
  const overlap = (reflow || !force) && vEnd > vStart && ns < vEnd && ne > vStart;
  if (overlap) {
    if (ns > vStart) { for (let k = vStart; k < ns; k++) g.firstElementChild?.remove(); }
    else if (ns < vStart) { g.insertAdjacentHTML('afterbegin', items.slice(ns, vStart).map(cellHtml).join('')); }
    if (ne < vEnd) { for (let k = ne; k < vEnd; k++) g.lastElementChild?.remove(); }
    else if (ne > vEnd) { g.insertAdjacentHTML('beforeend', items.slice(vEnd, ne).map(cellHtml).join('')); }

    const gen = (updateWindow._gen = (updateWindow._gen || 0) + 1);
    const CHUNK = 400;

// ふわっと切替: 新画像を先読み→旧画像を上に重ねてフェードアウト(ガクッと差し替えない)
function lbCrossfade(src) {
  const img = $('lbimg');
  const pv = new Image();
  pv.src = src;
  const apply = () => {
    if (!$('lb').classList.contains('show')) { img.src = src; return; }
    const r = img.getBoundingClientRect();
    if (!r.width) { img.src = src; return; }
    const ghost = img.cloneNode();
    Object.assign(ghost.style, {
      position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px',
      margin: 0, zIndex: 39, pointerEvents: 'none', maxWidth: 'none', maxHeight: 'none',
      transition: 'opacity .38s ease',
    });
    document.body.appendChild(ghost);
    img.src = src;
    requestAnimationFrame(() => ghost.style.opacity = '0');
    setTimeout(() => ghost.remove(), 420);
  };
  if (pv.complete) apply(); else { pv.onload = apply; pv.onerror = () => { img.src = src; }; }
}

let segDrag = null;
function segBindPointer() {
  const img = $('lbimg');
  img.addEventListener('click', e => { if (lbSegOn) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  img.addEventListener('mousedown', e => {
    if (!lbSegOn || e.button !== 0) return;
    e.preventDefault(); e.stopImmediatePropagation();
    segDrag = {x: e.clientX, y: e.clientY, moved: false};
  }, true);
  addEventListener('mousemove', e => {
    if (!segDrag) return;
    if (Math.abs(e.clientX - segDrag.x) + Math.abs(e.clientY - segDrag.y) > 8) segDrag.moved = true;
    if (segDrag.moved) drawSegRect(e);
  });
  addEventListener('mouseup', e => {
    if (!segDrag) return;
    const d = segDrag; segDrag = null; $('segrect')?.remove();
    const r = img.getBoundingClientRect();
    if (!r.width) return;
    const nx = v => Math.min(1, Math.max(0, v));
    if (d.moved) {
      segRefine({box: [nx((Math.min(d.x, e.clientX) - r.left) / r.width), nx((Math.min(d.y, e.clientY) - r.top) / r.height),
                       nx((Math.max(d.x, e.clientX) - r.left) / r.width), nx((Math.max(d.y, e.clientY) - r.top) / r.height)]});
    } else {
      segRefine({points: [[nx((e.clientX - r.left) / r.width), nx((e.clientY - r.top) / r.height)]], labels: [1]});
    }
  });
  img.addEventListener('contextmenu', e => {
    if (!lbSegOn) return;
    e.preventDefault(); e.stopImmediatePropagation();
    const r = img.getBoundingClientRect();
    segDelAt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  }, true);
}
function drawSegRect(e) {
  let el = $('segrect');
  if (!el) {
    el = document.createElement('div'); el.id = 'segrect';
    el.style.cssText = 'position:fixed; border:1.5px dashed var(--acc); background:#4d9fff22; z-index:41; pointer-events:none; border-radius:4px';
    document.body.appendChild(el);

  el.style.left = Math.min(segDrag.x, e.clientX) + 'px';
  el.style.top = Math.min(segDrag.y, e.clientY) + 'px';
  el.style.width = Math.abs(e.clientX - segDrag.x) + 'px';
  el.style.height = Math.abs(e.clientY - segDrag.y) + 'px';
}

function lbMorphOpen(sha) {
  const cellDiv = sha && document.getElementById('c_' + sha);
  const cell = cellDiv?.querySelector('img');
  if (!cell || !cell.complete) return;
  // 始点はセル枠(divの実測)。imgはホバー拡大(scale1.05)中で座標が膨らんでいる(着地ズレの一因)
  const r = cellDiv.getBoundingClientRect();
  if (!r.width) return;
  const img = $('lbimg');
  // 本体img自身の入場アニメ(scale .92→1)を殺す: アニメ中の縮んだ座標を着地先として
  // 実測してしまい「アニメの先と実際の場所が違う」気持ち悪さの主因(2026-09-03)
  img.style.animation = 'none';
  const ghost = cell.cloneNode();
  Object.assign(ghost.style, {
    position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px',
    objectFit: 'cover', borderRadius: '10px', margin: 0, zIndex: 40, pointerEvents: 'none',
    boxShadow: '0 24px 70px #000a', transition: 'all .34s cubic-bezier(.22,.9,.24,1)',
  });
  document.body.appendChild(ghost);
  img.style.opacity = '0';
  // このモジュールはサイズを一切書かない(箱はlbView.showが最初から確保済み)。
  // 役割は「セル→箱の実測位置へゴーストが飛ぶ→本体が描ける状態になったら受け渡す」の演出だけ
  requestAnimationFrame(() => {
    const t0 = img.getBoundingClientRect();
    if (t0.width) Object.assign(ghost.style, {left: t0.left + 'px', top: t0.top + 'px',
                                width: t0.width + 'px', height: t0.height + 'px', borderRadius: '8px'});
  });
  let done = false;
  const reveal = () => {
    if (done) return;
    done = true;
    // 本体のデコード完了を待ってから見せ、描画された次フレームまでゴーストを重ねる
    // (どちらか欠けると受け渡しの瞬間に1フレーム抜けて「一瞬消える」)
    const fin = () => {
      img.style.opacity = ''; img.style.animation = '';
      requestAnimationFrame(() => requestAnimationFrame(() => ghost.remove()));
    };
    (img.decode ? img.decode().catch(() => {}) : Promise.resolve()).then(fin);
  };
  // 中身が入った(lbViewがtierを刻んだ)のを見届けてから、飛行時間ぶん待って受け渡し
  (function wait() {
    if (done) return;
    if (img.dataset.tier) setTimeout(reveal, 240);
    else requestAnimationFrame(wait);
  })();
  setTimeout(reveal, 900); // 保険: 読み込みが遅くても必ず出す
}

// ---- ズーム/パン/ピンチ(transformのみ=GPU) ----
let zm = 1, zx = 0, zy = 0;
function zApply(anim) {
  const el = $('lbimg');
  el.style.transition = anim ? 'transform .22s ease, filter .18s ease' : 'filter .18s ease';
  el.style.transform = zm > 1.01 ? `translate(${zx}px,${zy}px) scale(${zm})` : '';
  el.style.cursor = zm > 1.01 ? 'grab' : 'zoom-out';
}
function zReset() { zm = 1; zx = zy = 0; zApply(false); }
{
  const el = $('lbimg');
  let clickTimer = null, downAt = null, movedFar = false;
  el.addEventListener('click', e => {
    e.stopPropagation();
    // クロップ確定のpointerup直後に飛んでくるclickで閉じない(「クロップすると画面ごと消える」退行の真因 2026-09-03)
    if (cropEnded) { cropEnded = false; return; }
    if (cropMode || movedFar) return;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
      if (zm > 1.01) { zm = 1; zx = zy = 0; zApply(true); } // 拡大中→等倍
      else closeLb();                                        // 等倍→閉じる
    }, 230);
  });
  el.addEventListener('dblclick', e => {
    e.preventDefault(); clearTimeout(clickTimer);
    zm = zm > 1.01 ? 1 : 2.5; zx = zy = 0; zApply(true);
  });
  el.addEventListener('wheel', e => {
    e.preventDefault();
    zm = Math.min(8, Math.max(1, zm * (e.deltaY < 0 ? 1.25 : 0.8)));
    if (zm <= 1.01) { zx = zy = 0; }
    zApply(true);
  }, {passive: false});
  const pts = new Map();
  let panFrom = null, pinchFrom = null;
  el.addEventListener('pointerdown', e => {
    if (cropMode) { e.preventDefault(); el.setPointerCapture(e.pointerId); cropDown(e); return; }
    pts.set(e.pointerId, e); el.setPointerCapture(e.pointerId);
    downAt = {x: e.clientX, y: e.clientY}; movedFar = false;
    if (pts.size === 1 && zm > 1.01) panFrom = {x: e.clientX - zx, y: e.clientY - zy};
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinchFrom = {d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), zm};
      panFrom = null;
    }
  });
  el.addEventListener('pointermove', e => {
    if (cropMode) { cropMove(e); return; }
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) movedFar = true;
    if (pts.size === 2 && pinchFrom) {
      const [a, b] = [...pts.values()];
      zm = Math.min(8, Math.max(1, pinchFrom.zm * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinchFrom.d));
      zApply(false);
    } else if (panFrom && zm > 1.01) {
      zx = e.clientX - panFrom.x; zy = e.clientY - panFrom.y;
      zApply(false);
    }
  });
  ['pointerup', 'pointercancel'].forEach(ev => el.addEventListener(ev, e => {
    if (cropMode) { cropUp(e); return; }
    pts.delete(e.pointerId);
    if (pts.size < 2) pinchFrom = null;
    if (!pts.size) panFrom = null;
    if (zm <= 1.01) { zx = zy = 0; zApply(true); }
  }));
}

function edVals() {

                                            : `hue-rotate(${(v.temperature * 16).toFixed(1)}deg)`;

const ED_LABEL = {adjust: '調整', auto: '自動', filter: 'フィルタ', rotate: '回転', flip: '反転', crop: 'クロップ'};

    : '<span style="opacity:.6">履歴なし = 原本そのまま</span>';

async function edMutate(body) {
  const sha = items[lbIdx]?.sha1; if (!sha) return;
  try {
    const r = await j('/api/edits/' + sha, {method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)});

    edReset(); edHist(r.edits);

    { // レンダ完成+デコード後に差し替え(直接src交換だと生成待ちの間imgが幅0に潰れて「消えた」ように見える)
      const url = r.edits.length ? lbUrl(sha, 1600) : '/preview/' + sha + '?t=' + Date.now();

      }

      }, 800);

  } catch (e) { toast('❌ ' + e.message); }
}

// ✂ クロップ: ドラッグで範囲→離した瞬間に確定(比率で送るので回転後でも正しい)
let cropMode = false, cropStart = null, cropEnded = false; // cropEnded=確定直後のclickを1回飲む印
function cropToggle() {
  cropMode = !cropMode;
  $('cropbtn').classList.toggle('on', cropMode);
  $('lbimg').style.cursor = cropMode ? 'crosshair' : '';
  if (!cropMode) $('croprect').style.display = 'none';
  toast(cropMode ? '画像の上をドラッグして範囲指定 → 離すと確定' : 'クロップをやめました');
}
function cropDown(e) {
  cropStart = {x: e.clientX, y: e.clientY};
  const r = $('croprect');
  r.style.display = 'block';
  Object.assign(r.style, {left: e.clientX + 'px', top: e.clientY + 'px', width: '0px', height: '0px'});
}
function cropMove(e) {
  if (!cropStart) return;
  const r = $('croprect');
  Object.assign(r.style, {
    left: Math.min(cropStart.x, e.clientX) + 'px', top: Math.min(cropStart.y, e.clientY) + 'px',
    width: Math.abs(e.clientX - cropStart.x) + 'px', height: Math.abs(e.clientY - cropStart.y) + 'px'});
}
function cropUp(e) {
  if (!cropStart) return;
  const img = $('lbimg').getBoundingClientRect();
  const x0 = Math.max(img.left, Math.min(cropStart.x, e.clientX));
  const y0 = Math.max(img.top, Math.min(cropStart.y, e.clientY));
  const x1 = Math.min(img.right, Math.max(cropStart.x, e.clientX));
  const y1 = Math.min(img.bottom, Math.max(cropStart.y, e.clientY));
  cropStart = null;
  cropEnded = true; // 直後のclickは閉じ操作にしない
  $('croprect').style.display = 'none';
  const fw = (x1 - x0) / img.width, fh = (y1 - y0) / img.height;
  if (fw < 0.05 || fh < 0.05) return toast('範囲が小さすぎます');
  cropToggle();
  edPush({op: 'crop', params: {
    fx: +((x0 - img.left) / img.width).toFixed(4), fy: +((y0 - img.top) / img.height).toFixed(4),
    fw: +fw.toFixed(4), fh: +fh.toFixed(4)}});
}

// 削除アニメ: 対象はしゅっと縮み、残った子はFLIPで隙間に流れ込む(全再描画=黒画面をやめる)
function removeCellsAnimated(shas) {
  const old = {};
  document.querySelectorAll('.cell').forEach(el => { old[el.id] = el.getBoundingClientRect(); });
  let n = 0;
  shas.forEach(s => {
    const el = $('c_' + s);
    if (!el) return;
    n++;
    el.style.pointerEvents = 'none';
    el.animate([{opacity: 1, transform: 'scale(1)'}, {opacity: 0, transform: 'scale(.55)'}],
               {duration: 180, easing: 'ease-in'}).onfinish = () => {
      el.remove();
      if (--n === 0) requestAnimationFrame(() => {
        document.querySelectorAll('.cell').forEach(e2 => {
          const o = old[e2.id]; if (!o) return;
          const r2 = e2.getBoundingClientRect();
          const dx = o.left - r2.left, dy = o.top - r2.top;
          if (dx || dy) e2.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: 'none'}],
            {duration: 420, easing: 'cubic-bezier(.2,.9,.3,1)'});
        });
      });
    };
  });
  if (n === 0) render(true);
  drawSelbar();
}

// ライトボックス削除は楽観方式: 押した瞬間にUIから消して次を表示し、サーバへは裏で直列バッチ送信。
// 旧方式(サーバ応答待ち→次表示)は、応答が詰まると連打が同一画像への空撃ちになり
// 「そのうち消せなくなる」実害(2026-09-03 連打再現テストで確認: 25連打中8枚のみ削除+完全スタック)
const delQueue = [];
let delPumping = false;
async function pumpDel() {
  if (delPumping) return; delPumping = true;
  try {
    while (delQueue.length) {
      const batch = delQueue.splice(0); // 溜まった分をまとめて1リクエスト
      try {
        const r = await j('/api/trash', {method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({shas: batch})});
        lastTrashed = lastTrashed.concat(batch);
        toast(`${lastTrashed.length}枚をゴミ箱へ(30日は戻せます)`, '元に戻す', undoTrash);
      } catch (e) { toast('❌ 削除失敗(' + batch.length + '枚): ' + e.message); }
    }
    refreshFacets();
  } finally { delPumping = false; }
}
function lbDel() {
  const it = items[lbIdx]; if (!it) return;
  const i = lbIdx;
  $('lbimg').animate([{transform: 'none', opacity: 1}, {transform: 'scale(.85)', opacity: 0}],
                     {duration: 160, easing: 'ease-in'}); // 消える手応え
  if (!delQueue.length && !delPumping) lastTrashed = []; // 新しい削除セッションの開始
  items = items.filter(x => x.sha1 !== it.sha1);
  total = Math.max(0, total - 1);
  sel.delete(it.sha1);
  removeCellsAnimated([it.sha1]);
  delQueue.push(it.sha1);
  pumpDel();
  if (!items.length) closeLb();
  else lbShow(Math.min(i, items.length - 1), 1);
}

function watchCrawlPart(s) {
  try {
    $('crawlbar').classList.toggle('show', !!s.alive);
    if (s.alive) {
      const crA = albumsCache.find(x => x.name === s.album);
      $('cr_prog').innerHTML = `<b style="color:var(--tx)">${esc(s.album)}</b> +${s.ingested} (${(s.pass_rate * 100).toFixed(0)}%)` +

        (s.spent_tokens > 0 || s.spent_usd > 0
          ? ` <span style="color:#e5c07b; cursor:pointer" onclick="cycleCostMode(event)"
               title="この収集の実測コスト(クリックで トークン/$/¥ 切替。全フォルダ累計$${(s.total_usd || 0).toFixed(2)})">${fmtCost(s.spent_tokens, s.spent_usd)}</span>` : '');
      $('crawlbar').title = `候補${s.found} → 検査${s.checked} → 収蔵${s.ingested}\n「${s.query}」\n${s.last || ''}` +
        (s.queue?.length ? `\n順番待ち: ${s.queue.join(', ')}` : '');
      // 途中経過ストリップ: 採用=カラー / 捨てられた子=モノクロ+理由(ホバーで見える)
      $('cr_strip').innerHTML = (s.recent || []).map(e =>
        `<img src="${e.ok ? '/thumb/' + e.r : '/crawl/reject/' + e.r}"
           onmouseenter="hoverPv(this, '${esc(e.why)}')" onmouseleave="hoverPvHide()"
           style="width:26px; height:26px; object-fit:cover; border-radius:4px; flex:none; cursor:zoom-in;
                  ${e.ok ? 'outline:1px solid #6ee7a055' : 'filter:brightness(.6); outline:1px solid #a33333aa'}"
           onerror="this.remove()">`).join('');
      if (s.ingested !== watchCrawlPart._n) {
        const add = s.ingested - (watchCrawlPart._n || 0);
        watchCrawlPart._n = s.ingested;
        if (add > 0) liveDrop(s.album, add + 2);
        refreshFacets();
      }
    } else if (watchCrawlPart._was) {
      refreshFacets(); loadAlbums();

      if (loc.type === 'folder') renderViewhead();

async function liveDrop(album, n) {
  const okHere = (loc.type === 'lib' && loc.key === 'all') ||
    (loc.type === 'folder' && loc.criteria.source === 'crawl:' + album) ||
    (loc.type === 'source' && loc.key === 'crawl:' + album);
  if (!okHere) return;
  try {
    const r = await j('/api/images?' + new URLSearchParams({source: 'crawl:' + album, limit: n, offset: 0}));
    const fresh = r.items.filter(it => !items.some(x => x.sha1 === it.sha1));

    items = fresh.concat(items); total += fresh.length;
    if ($('lb').classList.contains('show')) lbIdx += fresh.length; // 開いてる画像の位置がズレないように
    updateWindow(true);
    if (vStart === 0) { // 先頭が見えている時だけ「ぽとっ」と落ちる演出

      <span style="flex:none; display:flex; gap:5px; align-items:center">${ic(icon, 12)} ${name}</span>
      <span style="margin-left:auto; opacity:.85; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:96px" title="${esc(detail)}">${esc(detail)}</span></div>`;
    const c = a.crawl, e = a.enrich, l = a.llm, g = a.ingest, s = a.system || {};
    const bar = (pct, hot) => `<span style="flex:1; height:4px; min-width:34px; border-radius:99px; background:#1c1e26; overflow:hidden">
      <span style="display:block; width:${Math.min(100, pct).toFixed(0)}%; height:100%; border-radius:99px;
        background:${hot ? '#e0a83c' : 'var(--acc)'}; transition:width .6s ease"></span></span>`;
    const gpu = s.gpu ? `<div style="display:flex; gap:6px; align-items:center; padding:2px 0" title="GPU ${s.gpu.util}% · VRAM ${(s.gpu.vram_used_mb / 1024).toFixed(1)}/${(s.gpu.vram_total_mb / 1024).toFixed(0)}GB">
      <span style="flex:none">GPU</span>${bar(s.gpu.util, s.gpu.util > 85)}
      <span style="flex:none; font-variant-numeric:tabular-nums">${s.gpu.util}% ${(s.gpu.vram_used_mb / 1024).toFixed(1)}/${(s.gpu.vram_total_mb / 1024).toFixed(0)}G</span></div>` : '';
    const ram = s.ram ? `<div style="display:flex; gap:6px; align-items:center; padding:2px 0" title="RAM ${s.ram.used_gb.toFixed(0)}/${s.ram.total_gb.toFixed(0)}GB">
      <span style="flex:none">RAM</span>${bar(100 * s.ram.used_gb / s.ram.total_gb, s.ram.used_gb / s.ram.total_gb > .85)}
      <span style="flex:none; font-variant-numeric:tabular-nums">${s.ram.used_gb.toFixed(0)}G</span></div>` : '';
    const qn = c.queue?.length || 0;
    const w = a.workers || {};
    const wrow = (icon, name, key) => {
      const x = w[key];
      return x ? row(icon, name, !!x.on, x.detail || '') : '';
    };
    $('ai_activity').innerHTML =
      row('globe', '収集', c.alive, (c.alive ? `${c.album} +${c.ingested}枚` : '待機') + (qn ? ` | 待ち${qn}` : '')) +
      (c.alive && c.next_query ? row('search', '先読み', true, `次「${c.next_query}」検索中`) : '') +
      row('eye', 'VLM', e.alive, e.alive ? `属性付け ${e.done}/${e.total}` : '待機') +
      row('cpu', 'LLM', l.busy || l.downloading, l.downloading ? `DL ${l.got_mb}/${l.total_mb}MB` : l.busy ? '生成中' : l.ready ? '常駐中' : '未ロード') +
      row('upload', '取込', g.alive, g.alive ? `${g.done}/${g.total}` : '待機') +
      (a.seg?.alive ? row('smart', 'マスク', true, `${a.seg.done}/${a.seg.total} 「${a.seg.prompt}」`) : '') +
      wrow('img', 'サムネ', 'micro') +      // micro120px焼き(裏方)
      wrow('spark', 'CLIP', 'clip') +       // 似た画像の索引(裏方)
      wrow('loop', '見回り', 'autopilot') + // ♻自動補充の巡回
      wrow('bot', 'お手入れ', 'groom') +    // 属性/マスクの穴埋め巡回
      gpu + ram;
    // ストレージ(ml-hub風メーター): ライブラリの量と、ディスクの余白
    if (s.disk && facetsCache) {
      const usedPct = 100 * s.disk.used_gb / (s.disk.total_gb || 1);
      $('storagebox').innerHTML = `
        <div style="display:flex; gap:6px; align-items:baseline">
          <b style="color:var(--tx); font-size:13px">${facetsCache.total.toLocaleString()}</b>枚
          <span>· ${(facetsCache.bytes / 1073741824).toFixed(1)}GB</span>
          ${facetsCache.cost_usd > 0 ? `<span style="margin-left:auto">$${facetsCache.cost_usd.toFixed(2)}</span>` : ''}
        </div>
        <div style="display:flex; gap:6px; align-items:center; margin-top:4px" title="ディスク ${s.disk.used_gb.toFixed(0)}/${s.disk.total_gb.toFixed(0)}GB使用">
          ${bar(usedPct, usedPct > 85)}
          <span style="flex:none; font-variant-numeric:tabular-nums">空き${s.disk.free_gb.toFixed(0)}GB</span>
        </div>`;
    }
  } catch (err) {}
}

// ================= キーボード / 無限スクロール / 起動 =================
new IntersectionObserver(es => { if (es[0].isIntersecting) loadMore(); },
  {root: $('gridwrap'), rootMargin: '700px'}).observe($('more'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('ovl').classList.contains('show')) { closeIngest(); return; }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === '/') { e.preventDefault(); $('q').focus(); return; }
  if (!$('lb').classList.contains('show')) {
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); delSelected(); }
    else if (e.key === 'z' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); undoTrash(); }
    // X=カーソルが乗っているサムネの選択トグル(ホバー拡大でチェックが押しにくい問題の回避 2026-09-03)
    else if ((e.key === 'x' || e.key === 'X') && window._hoverSha) {
      e.preventDefault();
      ckSelSha(window._hoverSha, e); // Shift+Xで範囲選択も効く
    }
    return;
  }
  if (e.key === 'Escape') closeLb();
  if ((e.key === 'o' || e.key === 'O') && $('lb').classList.contains('show')) lbOpenSource();
  else if (e.key === 'ArrowRight' || e.key === 'f') lbGo(1);
  else if (e.key === 'ArrowLeft' || e.key === 'd') lbGo(-1);
  else if (e.key === 'e') edToggle();
  else if (e.key === 's') lbKeep();
  else if (e.key === 'x' || e.key === ' ') { e.preventDefault(); lbSel(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); lbDel(); }
  else if (e.key === 'z' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); edUndo(); }
});
setInterval(watchActivity, 2000); // AI実況はこれ1本(稼働状況/収集/取込/完了リフレッシュ)
setInterval(refreshFacets, 30000);

(async function boot() {
  await Promise.all([refreshFacets(), loadAlbums()]);
  loadDatasets(); loadPresets(); watchActivity();
  const h = new URLSearchParams(location.hash.slice(1));
  for (const k of ['origin']) if (h.get('f_' + k)) fchips[k] = h.get('f_' + k);
  for (const k of ['q8', 'safe', 'clean', 'nowm']) if (h.get('f_' + k)) fchips[k] = true;
  for (const k of Object.keys(chipFilters)) if (h.get('c_' + k)) chipFilters[k] = h.get('c_' + k);
  $('fc_real').classList.toggle('on', fchips.origin === 'real');
  $('fc_synth').classList.toggle('on', fchips.origin === 'synthetic');
  ['q8', 'safe', 'clean', 'nowm'].forEach(k => $('fc_' + k).classList.toggle('on', !!fchips[k]));
  const t = h.get('t'), k = h.get('k');
  if (t === 'folder' && albumsCache.find(x => x.name === k)) openFolder(k);
  else if (t === 'dataset' && k) openDataset(k);
  else if (t === 'source' && k) go({type: 'source', key: k, criteria: {source: k}}, {keepChips: true});
  else if (t === 'search' && h.get('q')) { $('q').value = h.get('q'); prevLoc = {type: 'lib', key: 'all', criteria: {}}; go({type: 'search', key: '', criteria: {}}, {keepChips: true}); }
  else if (t === 'lib' && k && LIB.find(x => x.key === k)) go({type: 'lib', key: k, criteria: LIB.find(x => x.key === k).criteria}, {keepChips: true});
  else go({type: 'lib', key: 'all', criteria: {}}, {keepChips: true});
  const img = h.get('img');
  if (img) setTimeout(() => {
    const i = items.findIndex(x => x.sha1 === img);
    if (i >= 0) openLb(i);
    else { items.unshift({sha1: img}); total++; render(true); openLb(0); }
  }, 700);
})();
</script>
