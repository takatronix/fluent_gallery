<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>fluent_gallery</title>
<style>
  /* ==== v3「フォルダが主語」— 正本は docs/ui-v3.md。無彩色ダーク+アクセント1色+SVGアイコン ==== */
  :root {
    --bg:#0a0a0c; --side:#0e0f12; --panel:#14151a; --line:#232530; --hair:#1a1c24;
    --tx:#e8e9ec; --dim:#8b8e98; --faint:#5c5f6a;
    --acc:#4d9fff; --acc-soft:#4d9fff22; --ok:#6ee7a0;
  }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; height:100dvh; }
  body { background:var(--bg); color:var(--tx); overflow:hidden;
         font:13px/1.55 -apple-system,"SF Pro Text","Hiragino Sans",system-ui,sans-serif;
         display:grid; grid-template-columns:var(--sidew, 218px) 1fr; }
  ::selection { background:var(--acc-soft); }
  svg.ic { vertical-align:-2.5px; flex:none; }
  button { font:12.5px inherit; color:var(--dim); background:none; border:1px solid var(--line);
           border-radius:8px; padding:6px 12px; cursor:pointer; display:inline-flex; gap:6px;
           align-items:center; transition:color .15s, border-color .15s, background .15s; }
  button:hover { color:var(--tx); border-color:#3a3d4a; }
  button.pri { color:#fff; background:var(--acc); border-color:transparent; font-weight:600; }
  button.pri:hover { filter:brightness(1.1); }
  button.ghost { border-color:transparent; }
  button.on { color:var(--ok); border-color:#6ee7a055; }
  input, select { background:#0d0e12; color:var(--tx); border:1px solid var(--line);
                  border-radius:8px; padding:6px 11px; font-size:12.5px; outline:none; }
  input:focus { border-color:var(--acc); }

  /* ---- サイドバー ---- */
  aside { background:var(--side); border-right:1px solid var(--hair); padding:14px 10px 16px;
          overflow-y:auto; user-select:none; display:flex; flex-direction:column; position:relative; }
  /* サイドバー幅のドラッグつまみ(右端)。掴むと出る・普段は透明 */
  #sideresize { position:fixed; top:0; bottom:0; width:7px; cursor:col-resize; z-index:50;
                left:calc(var(--sidew, 218px) - 3px); }
  #sideresize:hover, #sideresize.on { background:#7aa2f744; }
  .brand { font-size:13.5px; font-weight:700; padding:2px 10px 10px; }
  .brand small { color:var(--faint); font-weight:400; margin-left:6px; }
  .sec { font-size:10px; font-weight:600; letter-spacing:.09em; color:var(--faint);
         padding:16px 10px 4px; text-transform:uppercase; display:flex; align-items:center; }
  .sec .add { margin-left:auto; cursor:pointer; padding:0 4px; border-radius:5px; display:flex; }
  .sec .add:hover { color:var(--tx); background:#ffffff0c; }
  .nav { display:flex; align-items:center; gap:8px; padding:5px 10px; border-radius:7px;
         color:var(--dim); cursor:pointer; font-size:12.5px; white-space:nowrap; }
  .nav:hover { background:#ffffff08; color:var(--tx); }
  .nav.on { background:var(--acc-soft); color:var(--tx); }
  .nav .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:76px; }
  .nav .n { margin-left:auto; font-size:10px; color:var(--faint); font-variant-numeric:tabular-nums;
            padding-left:6px; flex:none; max-width:46%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav .st { margin-left:auto; flex:none; display:flex; align-items:center; color:var(--ok); }
  .nav .del { display:none; margin-left:0; color:var(--faint); }
  .nav:hover .del { display:inline-flex; }
  .nav .del:hover { color:var(--tx); }
  /* ホバー中は枚数を隠し、間隔も詰めて操作アイコン(改名/新規/複製/削除)4つ分の居場所を作る */
  .nav:hover .n { display:none; }
  .nav:hover { gap:5px; }
  .nav:hover .nm { min-width:56px; }

  /* ---- メイン ---- */
  main { display:flex; flex-direction:column; overflow:hidden; }
  .top { display:flex; gap:8px; align-items:center; padding:10px 16px 8px; flex-wrap:wrap;
         border-bottom:1px solid var(--hair); }
  .search { flex:0 1 280px; min-width:170px; display:flex; align-items:center; gap:8px;
            background:#0d0e12; border:1px solid var(--line); border-radius:8px;
            padding:6px 12px; color:var(--faint); }
  .search input { background:none; border:none; padding:0; width:100%; }
  .fchip { font-size:11.5px; padding:5px 13px; border-radius:999px; } /* 丸く(2026-09-03指示) */
  .fchip.on { color:var(--tx); border-color:var(--acc); background:var(--acc-soft); }
  /* モードON中はページ背景もうっすら色づく(今どのモードで見ているか一目で分かる) */
  body.f-clean { background: radial-gradient(1200px 500px at 50% -100px, #113d2422, transparent), var(--bg); }
  body.f-safe { background: radial-gradient(1200px 500px at 50% -100px, #10365522, transparent), var(--bg); }
  body.f-clean.f-safe { background:
      radial-gradient(900px 420px at 30% -100px, #113d2422, transparent),
      radial-gradient(900px 420px at 70% -100px, #10365522, transparent), var(--bg); }
  /* 権利クリーン/セーフは意味が重要なチップ: ON時に色+太字で強調 */
  #fc_clean.on { color:#6ee7a0; border-color:#6ee7a0; background:#6ee7a01c; font-weight:700; }
  #fc_safe.on { color:#7ec8ff; border-color:#7ec8ff; background:#7ec8ff1c; font-weight:700; }
  .sp { flex:1; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; padding:0 16px; max-height:0; overflow:hidden;
           transition:max-height .25s ease, padding .25s ease; }
  .chips.open { max-height:220px; padding:8px 16px 2px; overflow-y:auto; }
  #chipsbtn .badge { background:var(--acc); color:#fff; border-radius:99px; font-size:10px;
                     padding:0 6px; margin-left:2px; }
  .resultcount { flex:none; inline-size:210px; contain:layout paint; text-align:right;
                 white-space:nowrap; color:var(--faint); font-size:11px;
                 font-variant-numeric:tabular-nums; }
  .pagecount { flex:none; inline-size:92px; contain:layout paint; text-align:right;
               white-space:nowrap; color:var(--dim); font-size:11px;
               font-variant-numeric:tabular-nums; }
  /* iPad横は詳細枚数を省き、ページ位置を優先してツールバーを2段に保つ。 */
  @media (min-width:901px) and (max-width:1200px) { .resultcount { display:none; } }
  .chip { font-size:11px; padding:3px 10px; border-radius:999px; border:1px solid var(--hair);
          background:none; color:var(--faint); cursor:pointer; transition:all .15s; }
  .chip:hover { color:var(--tx); border-color:#3a3d4a; }
  .chip.on { color:var(--tx); border-color:var(--acc); background:var(--acc-soft); }
  .chip small { opacity:.6; margin-left:3px; }
  .sub { font-size:11.5px; color:var(--faint); }

  /* ---- ビューヘッダ(今いる場所の説明+操作) ---- */
  #viewhead { display:none; margin:10px 16px 0; background:var(--panel); border:1px solid var(--line);
              border-radius:12px; padding:12px 16px; }
  #viewhead .row1 { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #viewhead .ttl { font-size:14px; font-weight:700; display:flex; gap:8px; align-items:center; }
  #viewhead .frow { display:flex; gap:8px; align-items:center; margin-top:8px; }
  #viewhead .frow .lbl { width:76px; text-align:right; flex:none; font-size:11px; color:var(--faint); }
  #viewhead .frow .rights-note { flex:1 1 220px; min-width:0; overflow-wrap:anywhere; white-space:normal; }
  #viewhead .goal { flex:1; min-width:220px; }
  #viewhead .lbl { font-size:11px; color:var(--faint); }
  #viewhead .last { font-size:11px; color:var(--faint); margin-top:9px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
  #viewhead .last b { color:var(--dim); }
  /* 自動収集はボタンでなくスイッチ(▶今すぐ1回とは役割が違うことを見た目で示す) */
  .switch { display:inline-flex; gap:7px; align-items:center; cursor:pointer; font-size:12px;
            color:var(--dim); border:1px solid transparent; padding:6px 10px; border-radius:8px; }
  .switch:hover { color:var(--tx); }
  .switch .track { width:30px; height:17px; border-radius:99px; background:#2a2d38; position:relative;
                   transition:background .2s; flex:none; }
  .switch .track::after { content:''; position:absolute; top:2px; left:2px; width:13px; height:13px;
                          border-radius:99px; background:#8b8e98; transition:transform .2s, background .2s; }
  .switch.on { color:var(--ok); }
  .switch.on .track { background:#1d4230; }
  .switch.on .track::after { transform:translateX(13px); background:var(--ok); }
  /* 検索元チェック(うるさくない小チップ) */
  .engchip { font-size:10.5px; padding:3px 11px; border-radius:99px; border:1px solid var(--hair);
             color:var(--faint); cursor:pointer; display:inline-flex; gap:5px; align-items:center;
             transition:all .15s; }
  .engchip svg { opacity:.55; flex:none; }
  /* ブーストの怪しいアイコン(2026-09-03指示「金と薬」): OFF=モノクロ、ON=フルカラー+金色の怪しい光 */
  .boost-glyph { font-size:12px; line-height:1; filter:grayscale(1); opacity:.55; letter-spacing:-2px; }
  .switch.on .boost-glyph { filter:none; opacity:1; text-shadow:0 0 9px #e5c07baa; }
  .engchip .eng-glyph { font-size:12px; line-height:1; filter:grayscale(1); opacity:.5; }
  .engchip.on .eng-glyph { filter:none; opacity:1; }
  .engchip:hover { color:var(--dim); border-color:var(--line); }
  .engchip.on { color:var(--tx); border-color:var(--acc); background:#4d9fff14; }
  .engchip.on svg { opacity:1; color:var(--acc); }

  #crawlbar, #genbar { display:none; margin:8px 16px 0; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:6px 12px; font-size:12px; color:var(--dim); }
  #crawlbar.show, #genbar.show { display:flex; }
  /* 種別アイコンの色(収集=青 / 生成=紫)と、動作中の行(脈打つ点+行の淡い光) docs/gen-design.md §3.2 */
  .kic { display:flex; align-items:center; flex:none; }
  .kic.crawl { color:#7fa7e0; } .kic.gen { color:#b48cff; }
  .nav.running { background:linear-gradient(90deg, transparent 0%, #6ee7a014 50%, transparent 100%); background-size:200% 100%; animation:navglow 6s linear infinite; }
  @keyframes navglow { from { background-position:200% 0; } to { background-position:-200% 0; } }
  .nav .st.live svg { animation:pulse 1.2s ease infinite; }
  @media (prefers-reduced-motion: reduce) { .nav.running { animation:none; } .nav .st.live svg { animation:none; } }
  /* 設定ページ(docs/gen-design.md §8.1): 節ごとのカード、行ごとに自動保存 */
  #grid.page { display:block; }  /* 設定/棚ページはサムネのグリッドではなく普通の文書として流す */
  .lgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:14px; }
  .lcard { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .lcard .art { position:relative; aspect-ratio:1; background:#0e1219; display:flex; align-items:center; justify-content:center; color:var(--faint); }
  .lcard .art img { width:100%; height:100%; object-fit:cover; display:block; }
  .lcard .art .arts { position:absolute; inset:auto 6px 6px auto; display:flex; gap:4px; }
  .lcard .art .arts img { width:40px; height:40px; border-radius:6px; border:1px solid #0009; }
  .lbadge { position:absolute; top:8px; left:8px; font-size:10px; font-weight:700; padding:2px 8px; border-radius:99px; color:#fff; background:#7c3aedcc; backdrop-filter:blur(3px); }
  .lbadge.zi { background:#0ea5e9cc; } .lbadge.qw { background:#2563ebcc; } .lbadge.ng { background:#7f1d1dcc; }
  .lcard .body { padding:9px 11px 10px; display:flex; flex-direction:column; gap:5px; font-size:12px; flex:1; }
  .lcard .nm { font-weight:700; font-size:13px; line-height:1.3; }
  .lcard .desc { font-size:11px; color:var(--faint); line-height:1.4; max-height:2.8em; overflow:hidden; }
  .lcard .trigs { display:flex; gap:4px; flex-wrap:wrap; } .lcard .trig { font-size:10px; padding:1px 7px; border-radius:99px; border:1px solid var(--hair); color:var(--dim); }
  .lcard .act { display:flex; gap:6px; margin-top:auto; padding-top:4px; } .lcard .act button { font-size:11.5px; padding:4px 9px; }
  .limport { display:flex; gap:8px; margin:0 0 12px; } .limport input { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 12px; color:var(--tx); font-size:12.5px; }
  .setpage.dropping { outline:2px dashed var(--acc); outline-offset:-6px; }
  .setpage { padding:14px 16px 40px; max-width:960px; }
  .setpage h2 { white-space:nowrap; }
  .setpage h2 { font-size:15px; margin:0 0 10px; display:flex; align-items:center; gap:8px; }
  .setsec { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 16px 12px; margin-bottom:12px; }
  .setsec h3 { font-size:12.5px; margin:0 0 4px; color:var(--tx); }
  .setsec .hint { font-size:11px; color:var(--faint); margin-bottom:6px; line-height:1.5; }
  .setrow { display:flex; gap:10px; align-items:center; padding:5px 0; font-size:12.5px; border-top:1px solid var(--hair); flex-wrap:wrap; }
  .setrow:first-of-type { border-top:none; }
  .setrow .lbl { width:150px; flex:none; color:var(--dim); font-size:11.5px; }
  .setrow input[type=text], .setrow input[type=password], .setrow input[type=number], .setrow select {
    background:var(--bg); border:1px solid var(--line); border-radius:8px; color:var(--tx); padding:5px 9px; font-size:12.5px; }
  .setrow input[type=text], .setrow input[type=password] { flex:1; min-width:160px; }
  .setrow .note { font-size:11px; color:var(--faint); }
  .setrow .ok { color:var(--ok); font-size:11px; }
  .setrow .ng { color:#e06c75; font-size:11px; }
  .setrow .saved { font-size:11px; color:var(--ok); opacity:0; transition:opacity .3s; }
  .setrow .saved.show { opacity:1; }
  #ah_plan { font-size:11.5px; color:var(--dim); line-height:1.5; margin:4px 0 0 0; padding-left:0; list-style:none; }
  #ah_plan li::before { content:'· '; color:var(--faint); }
  /* フォルダパネルは1行に畳む(サムネの場所を食わない)。⌄で展開 */
  #viewhead .details { display:none; }
  #viewhead.open .details { display:block; }
  /* 取り込みは呼んだ時だけの中央オーバーレイ(画面に居座らない) */
  #ovl { position:fixed; inset:0; background:#00000090; z-index:18; display:none;
         align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  #ovl.show { display:flex; animation:lbin .18s ease; }
  #ingestpanel { width:min(680px, 92vw); background:var(--panel); border:1px solid var(--line);
                 border-radius:14px; padding:16px 18px; font-size:12px; color:var(--dim);
                 box-shadow:0 24px 70px #000b; }
  .pulse { display:inline-block; width:7px; height:7px; border-radius:99px; background:var(--acc);
           margin-right:8px; animation:pulse 1.2s ease infinite; }
  @keyframes pulse { 50% { opacity:.3; transform:scale(.7); } }

  /* ---- グリッド: クリック=開く / ◯=選択 ---- */
  .gridwrap { flex:1; overflow-y:auto; overflow-anchor:none; padding:10px 16px 90px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--cell,168px),1fr)); gap:6px;
          align-content:start; }
  .grid.fit img { object-fit:contain; }
  .cell { position:relative; aspect-ratio:1; border-radius:6px; overflow:hidden; cursor:pointer;
    /* 画面外セルはレイアウト/描画/ラスタメモリごとスキップ(数千枚でも軽い)。サイズはヒントで確保 */
    content-visibility:auto; contain-intrinsic-size:var(--cell,168px) var(--cell,168px);
          background:var(--panel); opacity:0; transform:translateY(14px) scale(.97);
          transition:opacity .45s ease, transform .5s cubic-bezier(.2,.9,.3,1); }
  .cell.in { opacity:1; transform:none; }
  .cell img { width:100%; height:100%; object-fit:cover; display:block; }
  /* 最小表示は200枚を1 JPEGへ束ねる。各imgは同じatlas surfaceの担当タイルだけを切り出す。 */
  .cell img.atlas { position:absolute; max-width:none; max-height:none; object-fit:fill !important;
                    width:var(--atlas-w); height:var(--atlas-h); left:var(--atlas-l); top:var(--atlas-t); }
  /* 高速scroll中のsrc退避imgはChromeが欠損画像の白枠を描くため、hydrateまで親背景だけ見せる */
  .cell img:not([src]), .cell img[data-src] { visibility:hidden; }
  .cell::after { content:''; position:absolute; inset:0; border-radius:6px; pointer-events:none; }
  .cell .ck { position:absolute; top:6px; left:6px; width:22px; height:22px; border-radius:99px;
              border:1.5px solid #4d9fff99; background:#00000038; cursor:pointer; opacity:0;
              transition:opacity .12s, background .12s, border-color .12s; z-index:2;
              display:flex; align-items:center; justify-content:center; color:transparent; }
  @media (hover:hover) { .cell:hover .ck { opacity:1; } }
  body.selmode .ck { opacity:1; }
  .cell.sel .ck { opacity:1; background:var(--acc); border-color:var(--acc); color:#fff; }
  .cell.sel { outline:2px solid var(--acc); outline-offset:-2px; }
  .cell.cur { outline:2px solid var(--acc); outline-offset:-2px; } /* キーボードカーソル(Finder流) */
  .cell.sel.cur { outline:2px solid var(--acc); }
  /* 選択時も画像を縮めて周囲のガターを出さず、青いチェック/outlineだけで示す */
  .cell .badge { position:absolute; top:7px; right:7px; z-index:2; color:#aeb4c2; opacity:0;
                 cursor:pointer; filter:drop-shadow(0 1px 3px #000c);
                 transition:opacity .12s, color .12s, transform .12s; }
  @media (hover:hover) { .cell:hover .badge { opacity:.9; } }
  .cell .badge:hover { transform:scale(1.25); }
  .cell .badge.on { opacity:1; color:#f2c14e; }
  .facebox { position:fixed; z-index:45; border:2px solid #ffffff90; border-radius:9px; cursor:pointer;
             transition:border-color .12s, box-shadow .12s; }
  .facebox:hover { border-color:var(--acc); }
  .facebox.on { border-color:#f2c14e; box-shadow:0 0 14px #f2c14e66; }
  .tag.ptag { color:#f2c14e; border-color:#f2c14e55; } /* 顔ID(本人確認済み)タグは金色 */
  /* 属性は既存の枠線用疑似要素へ固定記号だけ描く。追加DOM/SVG/data属性/金額整形はゼロ。 */
  .cell:is(.m1,.m2,.m3,.m4,.m5,.m6,.m7)::after { box-sizing:border-box; padding:0 6px 5px;
    display:flex; align-items:flex-end; justify-content:flex-end; color:#e8ecf2c7;
    font-size:10px; font-weight:750; line-height:1; letter-spacing:2px; text-shadow:0 1px 3px #000; }
  /* 権利クリーン(bit1)は緑の丸✓を左下に(2026-09-05 指摘「権利クリーンのアイコンが分からない」)。$/○ は従来どおり右下 */
  .cell:is(.m1,.m3,.m5,.m7)::before { content:'✓'; position:absolute; left:6px; bottom:6px; width:16px; height:16px; border-radius:99px;
    background:#22c55ee0; color:#fff; font-size:10px; font-weight:800; line-height:16px; text-align:center; z-index:1; pointer-events:none; box-shadow:0 1px 4px #0009; }
  .cell.m1::after { content:''; }
  .cell.m2::after { content:'$'; }
  .cell.m3::after { content:'$'; }
  .cell.m4::after { content:'○'; }
  .cell.m5::after { content:'○'; }
  .cell.m6::after { content:'$ ○'; }
  .cell.m7::after { content:'$ ○'; }
  body.dense .cell:is(.m1,.m3,.m5,.m7)::before { content:''; background:transparent; box-shadow:none; }
  .refchip { position:relative; display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:8px; padding:2px 6px 2px 2px; font-size:11px; color:var(--dim); background:var(--bg); }
  .refchip img { width:28px; height:28px; object-fit:cover; border-radius:5px; }
  .refchip .rm { cursor:pointer; opacity:.6; } .refchip .rm:hover { opacity:1; color:#e06c75; }
  #ah_prev { width:128px; height:128px; object-fit:cover; border-radius:10px; background:#0e1219; border:1px solid var(--line); }
  #gn_prev { width:34px; height:34px; object-fit:cover; border-radius:6px; flex:none; background:#0e1219; }
  .cell .newb { position:absolute; bottom:6px; left:6px; z-index:1; font-size:9px; font-weight:700;
                letter-spacing:.05em; color:#fff; background:var(--acc); border-radius:5px;
                padding:1px 6px; box-shadow:0 1px 5px #0009; }
  .cell .cap { position:absolute; inset-inline:0; bottom:0; padding:18px 8px 5px; font-size:10.5px;
               color:#dfe2e8; background:linear-gradient(transparent,#000b); opacity:0;
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:opacity .2s; }
  @media (hover:hover) { .cell:hover .cap { opacity:1; } }

// ================= 基盤 =================
async function j(u, opt) { const r = await fetch(u, opt);
  if (!r.ok) { let m='HTTP '+r.status; try{m=(await r.json()).detail||m}catch(e){} throw new Error(m); }
  return r.json(); }
const $ = id => document.getElementById(id);
function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }
function toast(m, actLabel, actFn) {
  const t = $('toast');
  t.innerHTML = m + (actLabel ? ` <b style="cursor:pointer; margin-left:10px; color:var(--acc)" onclick="toastAct()">${actLabel}</b>` : '');
  t.style.pointerEvents = actLabel ? 'auto' : 'none';
  window._toastFn = actFn;
  t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), actLabel ? 6500 : 2800);
}
function toastAct() { const f = window._toastFn; window._toastFn = null; $('toast').classList.remove('show'); if (f) f(); }

    origin: fchips.origin, nsfw: fchips.safe ? '0' : '', min_quality: fchips.q8 ? 8 : 0,
    rights: fchips.clean ? 'clean' : '',
    seg: fchips.seg ? '1' : '',
    tag: chipFilters.tag, scene: chipFilters.scene, subject: chipFilters.subject, style: chipFilters.style,
    gender: chipFilters.gender, framing: chipFilters.framing, age_group: chipFilters.age_group,
    people_count: chipFilters.people_count, animal: chipFilters.animal,
    watermark: fchips.nowm ? '0' : '',
  };
  return new URLSearchParams({...base, ...Object.fromEntries(Object.entries(o).filter(([, v]) => v !== '' && v !== 0)), ...extra});
}

// URL同期(コピペで同じ画面)
function syncHash() {
  const o = {t: loc.type, k: loc.key || ''};
  if (loc.type === 'search') o.q = $('q').value.trim();
  for (const [k, v] of Object.entries(fchips)) if (v) o['f_' + k] = typeof v === 'boolean' ? '1' : v;
  for (const [k, v] of Object.entries(chipFilters)) if (v) o['c_' + k] = v;
  if ($('lb').classList.contains('show') && items[lbIdx]) o.img = items[lbIdx].sha1;
  history.replaceState(null, '', '#' + new URLSearchParams(o).toString());
}

// ---- 移動(全ナビはここを通る) ----
async function go(next, opts = {}) {
  if (loc.type === 'search' && next.type !== 'search') $('q').value = '';
  loc = next;
  clearSel();
  closeIngest(); // 場所を移動したら浮きパネルは閉じる(邪魔問題)
  $('genpanel').style.display = 'none';
  if (!opts.keepChips) { chipFilters = {tag: '', scene: '', subject: '', style: '', gender: '', framing: '', age_group: '', people_count: '', animal: ''}; }
  renderNav();
  renderViewhead();
  if (loc.type === 'new') { // 新規フォルダは空で生まれる(憲法2条)
    items = []; total = 0;
    $('grid').innerHTML = newEmptyHtml();
    drawSelbar();
    return;
  }
  $('grid').classList.toggle('page', loc.type === 'settings' || loc.type === 'lora');
  if (loc.type === 'settings') { // 設定ページ(§8.1): グリッドの場所に描く。検索やチップは効かない
    items = []; total = 0; drawSelbar(); syncHash();
    await renderSettings();
    return;
  }
  if (loc.type === 'lora') { // LoRA 棚(G4)
    items = []; total = 0; drawSelbar(); syncHash();
    await renderLora();
    return;
  }
  await reload();
}

function onSearch() {
  const v = $('q').value.trim();
  // いた場所の条件(フォルダのsource等)を引き継いで「その中を」検索する。全体は検索ヘッダのボタンで広げる
  if (v && loc.type !== 'search') { prevLoc = loc;
    go({type: 'search', key: prevLoc.key || '', criteria: {...(prevLoc.criteria || {})}}, {keepChips: true}); }

}

async function nlSearch() {
  const text = $('q').value.trim();

  toast('AIが検索条件に翻訳中…');
  try {
    const r = await j('/api/nlq', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})});

    fchips.origin = r.origin || '';

function buildTree(list) {
  const root = {f: {}, items: []};
  for (const it of list) {
    let n = root;
    for (const part of (it.folder || '').split('/').filter(Boolean)) n = n.f[part] ??= {f: {}, items: []};
    n.items.push(it);
  }
  return root;
}
// kind='folder' のグループ行だけ、掴んで動かせる/名前を変えられる(データセットの棚は読み取り専用)
function treeHtml(node, item, depth = 0, key = '', kind = '') {
  let h = '';
  for (const name of Object.keys(node.f).sort()) {
    const k = key + '/' + name, open = !folded.has(k), path = k.slice(1);
    const gk = kind === 'folder' ? 'group' : kind === 'dataset' ? 'dsgroup' : '';
    const dnd = gk
      ? ` data-grp="${esc(path)}" draggable="true" ondragstart="dragNav(event, '${gk}', this.dataset.grp)"
         ondragend="dragEnd(event)" ondragover="navOver(event, '${gk}', this.dataset.grp)"
         ondragleave="navLeave(event)" ondrop="navDrop(event, '${gk}', this.dataset.grp)"
         oncontextmenu="ctxMenu(event, '${gk}', this.dataset.grp)"` : '';
    h += `<div class="nav"${dnd} style="padding-left:${10 + depth * 13}px" onclick="toggleFold('${k.replace(/'/g, "\\'")}')">
      ${ic(open ? 'chevD' : 'chevR', 13)}<span class="nm" style="color:var(--faint)"${
        gk ? ` ondblclick="startRename(event, '${gk}', this.closest('.nav').dataset.grp)"` : ''}>${esc(name)}</span>` +
      (gk ? `<span class="del" title="棚の名前を変える(ダブルクリックでも)"
        onclick="startRename(event, '${gk}', this.closest('.nav').dataset.grp)">${ic('pen', 12)}</span>` : '') +

      `</div>`;
    if (open) h += treeHtml(node.f[name], item, depth + 1, k, kind);
  }
  return h + node.items.map(it => item(it, depth)).join('');
}

function dragShas(ev, sha) {

async function dropShas(ev, source) {

// ================= サイドバーの整理: 改名 / D&D移動 / 合流(2026-09-04) =================
// 掴んでいる物はJS変数で覚える(dragover中はdataTransferの中身を読めないブラウザ仕様のため)
let dragNav_ = null;
let renaming = null; // 改名中はサイドバーを描き替えない目印
function dragNav(ev, kind, key) {
  if (renaming) { ev.preventDefault(); return; }
  dragNav_ = {kind, key};
  ev.dataTransfer.setData(kind === 'group' ? 'text/group' : 'text/album', key);
  ev.dataTransfer.effectAllowed = 'move';
  ev.currentTarget.classList.add('dragging');
  ev.stopPropagation();
}
function dragEnd(ev) {
  dragNav_ = null;
  ev.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.dropon, .mergeon').forEach(e => e.classList.remove('dropon', 'mergeon'));
}
function albumFolder(name) { return albumsCache.find(x => x.name === name)?.folder || ''; }
function dsFolder(name) { return datasetsCache.find(x => x.name === name)?.folder || ''; }
function parentOf(path) { return path.split('/').slice(0, -1).join('/'); }
// フォルダの木(f)と出荷の木(d)。木をまたぐD&Dは無効(データセットをフォルダの棚には入れない)
const TREE = {album: 'f', group: 'f', root: 'f', source: 'f', dataset: 'd', dsgroup: 'd', dsroot: 'd'};
// 落とせるか+何になるか。落とせる時だけカーソルが「置ける」に変わる(できない所に落とせる嘘をつかない)
function dropKind(target, key) {
  const d = dragNav_;
  if (!d || TREE[d.kind] !== TREE[target]) return null;
  if (d.kind === 'album') {
    if (target === 'source') return null;                          // 取り込み元は自動グループ(受け皿ではない)
    if (target === 'album') return d.key === key ? null : 'merge'; // フォルダ→フォルダ = 合流
    return albumFolder(d.key) === (target === 'root' ? '' : key) ? null : 'move';
  }
  if (d.kind === 'dataset') {
    if (target === 'dataset') return null;                         // 出荷済みスナップショット同士は合流しない
    return dsFolder(d.key) === (target === 'dsroot' ? '' : key) ? null : 'move';
  }
  // 棚(グループ)はフォルダ側も出荷側も同じ規則
  if (target === 'album' || target === 'dataset' || target === 'source') return null;
  const to = (target === 'root' || target === 'dsroot') ? '' : key;
  if (to === d.key || to.startsWith(d.key + '/')) return null;     // 自分の中へは移せない
  if (parentOf(d.key) === to) return null;                         // すでにそこにいる
  return 'move';
}
function navOver(ev, target, key) {
  if (dragNav_) {
    const k = dropKind(target, key);
    if (!k) return;
    ev.preventDefault();
    ev.currentTarget.classList.add(k === 'merge' ? 'mergeon' : 'dropon');
    return;
  }
  if (!ev.currentTarget.dataset.dsrc) return; // 画像のD&D: バケツを持つ行だけ受ける(従来どおり)
  ev.preventDefault();
  ev.currentTarget.classList.add('dropon');
}
function navLeave(ev) { ev.currentTarget.classList.remove('dropon', 'mergeon'); }
function navDrop(ev, target, key) {
  ev.preventDefault(); ev.stopPropagation();
  ev.currentTarget.classList.remove('dropon', 'mergeon');
  const d = dragNav_;
  if (!d) return dropShas(ev, ev.currentTarget.dataset.dsrc); // 画像の移動(従来)
  const k = dropKind(target, key);
  dragNav_ = null;
  if (!k) return;
  if (k === 'merge') return mergeAlbums(d.key, key);
  const to = (target === 'root' || target === 'dsroot') ? '' : key;
  if (d.kind === 'album') return moveAlbum(d.key, to);
  if (d.kind === 'dataset') return moveDataset(d.key, to);
  return moveGroup(d.key, to, d.kind === 'dsgroup' ? 'dataset' : '');
}
async function moveDataset(name, folder) {
  try {
    await j('/api/datasets/' + encodeURIComponent(name) + '/move', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify({folder})});
    toast(`「${name}」を${folder ? `「${folder}」の棚へ` : '一番上へ'}移しました`);
    await loadDatasets();
  } catch (e) { toast('❌ ' + e.message); }
}
async function moveAlbum(name, folder) {
  try {
    await j('/api/albums/' + encodeURIComponent(name) + '/move', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify({folder})});
    toast(`「${name}」を${folder ? `「${folder}」の中へ` : '一番上へ'}移しました`);
    await loadAlbums();
  } catch (e) { toast('❌ ' + e.message); }
}
async function moveGroup(from, toParent, kind = '') {
  const to = (toParent ? toParent + '/' : '') + from.split('/').pop();
  try {
    const r = await j('/api/folders/rename', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify({from, to, kind})});
    refoldPrefix(from, r.to || to);
    toast(`${kind === 'dataset' ? '棚' : 'グループ'}「${from.split('/').pop()}」を${toParent ? `「${toParent}」の中へ` : '一番上へ'}移しました(${r.changed}個)`);
    await (kind === 'dataset' ? loadDatasets() : loadAlbums());
  } catch (e) { toast('❌ ' + e.message); }
}
// 開いている/畳んでいるの記憶も名前について行かせる(移動後に勝手に畳まれない)
function refoldPrefix(from, to) {
  const a = '/' + from, b = to ? '/' + to : '';
  const next = new Set();
  for (const k of folded) next.add(k === a ? b : (k.startsWith(a + '/') ? b + k.slice(a.length) : k));
  folded = next;
  localStorage.setItem('fg_fold', JSON.stringify([...folded]));

// ---- インライン改名(prompt禁止=憲法5条。その場で書き換えてEnter/フォーカスアウトで確定、Escで取消) ----
function startRename(ev, kind, key) {
  ev.stopPropagation(); ev.preventDefault();
  beginRename(ev.currentTarget.closest('.nav'), kind, key);
}
function beginRename(row, kind, key) {
  if (renaming) document.querySelector('input.rn')?.blur(); // 開きっぱなしの別の入力を先に閉じる
  const nm = row?.querySelector('.nm');
  if (!nm || renaming) return;
  renaming = {kind, key};
  row.draggable = false;
  nm.textContent = '';
  const inp = document.createElement('input');
  inp.className = 'rn';
  inp.value = kind === 'group' ? key.split('/').pop() : key;
  inp.spellcheck = false;
  nm.appendChild(inp);
  const stop = e => e.stopPropagation();
  inp.onclick = stop; inp.onmousedown = stop; inp.ondblclick = stop;
  inp.onkeydown = e => {
    e.stopPropagation(); // グリッドのキーボード操作に食われない
    if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
    else if (e.key === 'Escape') { e.preventDefault(); inp.dataset.cancel = '1'; inp.blur(); }
  };
  inp.onblur = () => endRename(inp, kind, key);
  inp.focus(); inp.select();
}
async function endRename(inp, kind, key) {
  if (inp.dataset.done) return; // Enter→blur で二重に走らせない
  inp.dataset.done = '1';
  const v = inp.value.trim(), cancelled = inp.dataset.cancel === '1';
  const cur = kind === 'group' ? key.split('/').pop() : key;
  const nm = inp.parentElement, row = inp.closest('.nav');
  renaming = null;
  // 取消/変更なしは元の文字に戻すだけ。ここでサイドバーを描き直すと、
  // 次に押されるはずのボタンが消えて「押しても何も起きない」になる(2026-09-04報告の真因)
  const restore = () => { if (nm) nm.textContent = cur; if (row) row.draggable = true; };
  if (cancelled || !v || v === cur) { restore(); return; }
  try {
    if (kind === 'album') {
      const r = await j('/api/albums/' + encodeURIComponent(key) + '/rename', {method: 'POST',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify({to: v})});
      toast(`「${key}」→「${r.name}」に変更${r.moved ? `(中身${r.moved}枚も一緒に引っ越し)` : ''}`);
      await loadAlbums();
      if (loc.type === 'folder' && loc.key === key) openFolder(r.name);
    } else if (kind === 'dataset') {
      const r = await j('/api/datasets/' + encodeURIComponent(key) + '/rename', {method: 'POST',
        headers: {'Content-Type': 'application/json'}, body: JSON.stringify({to: v})});
      // 出荷先は学習ツールが読むディレクトリ名なので英数字だけ(日本語は_になる)。結果をそのまま見せる
      toast(`データセット「${key}」→「${r.name}」に変更`);
      await loadDatasets();
      if (loc.type === 'dataset' && loc.key === key) openDataset(r.name);
    } else {
      const to = (parentOf(key) ? parentOf(key) + '/' : '') + v;
      const ds = kind === 'dsgroup';
      const r = await j('/api/folders/rename', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({from: key, to, kind: ds ? 'dataset' : ''})});
      refoldPrefix(key, r.to || to);
      toast(`${ds ? '棚' : 'グループ'}「${cur}」→「${v}」に変更(${r.changed}個)`);
      await (ds ? loadDatasets() : loadAlbums());
    }
  } catch (e) { toast('❌ ' + e.message); restore(); }
}

// ---- 確認ポップアップ(ネイティブconfirm禁止=憲法5条。戻すのが大変な操作にだけ出す) ----
function confirmBox({title, body, ok = 'OK', danger = false, icon = 'merge'}) {
  return new Promise(resolve => {
    $('cfovl')?.remove();
    const ovl = document.createElement('div');
    ovl.id = 'cfovl';
    ovl.innerHTML = `<div class="box"><div class="t">${ic(icon, 15)}${title}</div>
      <div class="b">${body}</div>
      <div class="a"><button class="ghost" data-no>やめる</button>
        <button class="${danger ? 'danger' : 'pri'}" data-yes>${ok}</button></div></div>`;
    const key = e => {
      if (e.key !== 'Escape' && e.key !== 'Enter') return;
      e.preventDefault(); e.stopPropagation();
      done(e.key === 'Enter');
    };
    const done = v => { document.removeEventListener('keydown', key, true); ovl.remove(); resolve(v); };
    ovl.onclick = e => { if (e.target === ovl) done(false); };
    ovl.querySelector('[data-no]').onclick = () => done(false);
    ovl.querySelector('[data-yes]').onclick = () => done(true);
    document.addEventListener('keydown', key, true);
    document.body.appendChild(ovl);
    // 危ない方のボタンにフォーカスを置かない(Enterは効くがカーソルは中立)
    const box = ovl.querySelector('.box');
    box.tabIndex = -1; box.style.outline = 'none'; box.focus();
  });
}

// ---- 合流(フォルダに別のフォルダを落とす) ----
async function mergeAlbums(from, into) {
  const a = albumsCache.find(x => x.name === from), b = albumsCache.find(x => x.name === into);
  if (!a || !b) return;
  const na = a.count ?? 0, nb = b.count ?? 0;
  const ok = await confirmBox({
    title: 'フォルダを合流しますか?',
    body: `<b>${esc(from)}</b>(${na}枚)の中身を <b>${esc(into)}</b>(${nb}枚)へ移します。<br>
      合流後は <b>${esc(into)}</b> が <b>${na + nb}枚</b>、<b>${esc(from)}</b> は無くなります。<br><br>
      <span class="sub">画像は1枚も消えません(置き場所が変わるだけ)。集めた履歴・キーワード・使ったコストも引き継ぎます。
      元に戻すには、また分けて集め直す必要があります。</span>`,
    ok: '合流する', danger: true});
  if (!ok) return;
  try {
    const r = await j('/api/albums/merge', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({from, into})});
    toast(`${r.moved}枚を「${into}」へ合流しました`);
    const wasHere = loc.type === 'folder' && loc.key === from;
    await loadAlbums();
    refreshFacets();
    if (wasHere) openFolder(into); else reload();
  } catch (e) { toast('❌ ' + e.message); }
}

async function loraDrop(ev) {

  try { const r = await j('/api/lora/upload', {method: 'POST', body: fd}); toast(r.ok ? `取り込みました: ${r.added.join(', ')}` : '❌ ' + r.errors.join(' / ')); renderLora(); }

async function loraMakeFolder(file) {

        agent: {auto: false, target: 50, batch: 10, min_quality: 5}, keywords: [], engines: [], criteria: {source: 'gen:' + name}})});

async function genLoraAdd(sel) {
  const file = sel.value; sel.value = ''; if (!file) return;
  const a = albumsCache.find(x => x.name === loc.key); if (!a) return;
  const lora = [...(a.recipe?.lora || []), {file, scale: 1.0}];
  try { await saveGenRecipe(a.name, {lora}); renderViewhead(); } catch (e) { toast('❌ ' + e.message); }
}
async function genLoraRemove(i) {
  const a = albumsCache.find(x => x.name === loc.key); if (!a) return;
  const lora = [...(a.recipe?.lora || [])]; lora.splice(i, 1);
  try { await saveGenRecipe(a.name, {lora}); renderViewhead(); } catch (e) { toast('❌ ' + e.message); }
}
async function genLoraScale(i, v) {
  const a = albumsCache.find(x => x.name === loc.key); if (!a) return;
  const lora = [...(a.recipe?.lora || [])]; if (!lora[i]) return; lora[i] = {...lora[i], scale: Math.min(2, Math.max(0.05, parseFloat(v) || 1))};
  try { await saveGenRecipe(a.name, {lora}); a.recipe.lora = lora; } catch (e) { toast('❌ ' + e.message); }
}

function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? undefined : a[k]), o); }
async function setSetting(el) {
  const path = el.dataset.path; let value = el.value;
  if (el.type === 'number') value = Number(value);
  try {
    const r = await j('/api/settings', {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path, value})});
    if (setCache) setCache.config = r.config;
    const s = el.closest('.setrow')?.querySelector('.saved'); if (s) { s.classList.add('show'); setTimeout(() => s.classList.remove('show'), 1500); }
    if (path.startsWith('keys.')) { el.value = ''; setTimeout(renderSettings, 400); } // キーは表示を「設定済 …末尾」に切り替える
  } catch (e) { toast('❌ ' + e.message); }
}
async function toggleSetting(el, path) {
  const on = !el.classList.contains('on');
  try {
    const r = await j('/api/settings', {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path, value: on})});
    if (setCache) setCache.config = r.config;
    el.classList.toggle('on', on);
    const s = el.closest('.setrow')?.querySelector('.saved'); if (s) { s.classList.add('show'); setTimeout(() => s.classList.remove('show'), 1500); }
  } catch (e) { toast('❌ ' + e.message); }
}
async function clearSetting(path) {
  try {
    await j('/api/settings', {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({path, value: ''})});
    toast('消しました'); renderSettings();
  } catch (e) { toast('❌ ' + e.message); }
}
async function testSetting(btn, what) {
  const out = btn.closest('.setrow')?.querySelector(`[data-test="${what}"]`); if (out) { out.textContent = '確認中…'; out.className = 'note'; }
  try {
    const r = await j('/api/settings/test', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({what})});
    if (out) { out.textContent = r.detail; out.className = r.ok ? 'ok' : 'ng'; }
  } catch (e) { if (out) { out.textContent = e.message; out.className = 'ng'; } }
}

// 参照の追加/削除(レシピを即保存して描き直す)
async function saveGenRecipe(name, patch) {
  const a = albumsCache.find(x => x.name === name); if (!a) return;
  const recipe = {...(a.recipe || {}), ...patch};
  await j('/api/albums', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name: a.name, folder: a.folder || '', goal: a.goal || '', agent: a.agent || {}, keywords: a.keywords || [], engines: a.engines || [], criteria: a.criteria, kind: 'gen', recipe})});
  a.recipe = recipe;
}
async function genRefAdd(sel) {
  const v = sel.value; sel.value = ''; if (!v) return;
  const a = albumsCache.find(x => x.name === loc.key); if (!a) return;
  const [kind, key] = [v.slice(0, v.indexOf(':')), v.slice(v.indexOf(':') + 1)];
  const refs = [...(a.recipe?.refs || []), kind === 'folder' ? {kind, album: key, k: 1} : {kind, name: key, k: 1}];
  try { await saveGenRecipe(a.name, {refs}); renderViewhead(); toast('参照に足しました — 毎回ここから1枚を抽選して参照にします'); } catch (e) { toast('❌ ' + e.message); }
}
async function genRefRemove(i) {
  const a = albumsCache.find(x => x.name === loc.key); if (!a) return;
  const refs = [...(a.recipe?.refs || [])]; refs.splice(i, 1);
  try { await saveGenRecipe(a.name, {refs}); renderViewhead(); } catch (e) { toast('❌ ' + e.message); }
}
// 「似た画像を作る」: 生成フォルダを見ていればその参照に足す、そうでなければ参照つきの新しい生成フォルダを作って開く
async function makeFromImage(sha) {
  if (!sha) return;
  const cur = albumsCache.find(x => x.name === loc.key && x.kind === 'gen');
  try {
    if (loc.type === 'folder' && cur) {
      if ((cur.recipe?.refs || []).some(r => r.sha === sha)) return toast('もう参照に入っています');
      await saveGenRecipe(cur.name, {refs: [...(cur.recipe?.refs || []), {kind: 'image', sha}]});
      renderViewhead(); toast(`「${cur.name}」の参照に足しました`);
      return;
    }
    const name = '作る_' + sha.slice(0, 6);
    await j('/api/albums', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({name, folder: '', goal: '', kind: 'gen', recipe: {refs: [{kind: 'image', sha}], size: '1024x1024'},
        agent: {auto: false, target: 30, batch: 10, min_quality: 5}, keywords: [], engines: [], criteria: {source: 'gen:' + name}})});
    closeLb?.(); await loadAlbums(); openFolder(name);
    setTimeout(() => { $('viewhead')?.classList.add('open'); $('ah_goal')?.focus(); }, 150);
    toast('参照つきの生成フォルダを作りました — 「作る物」に変え方を書いて ▶');
  } catch (e) { toast('❌ ' + e.message); }
}

function genTimeEst(a) {
  const batch = a.agent?.batch || 30;
  const n = Math.max(1, Math.min(batch, Math.max(batch, (a.agent?.target || 200) - (a.count || 0))));
  const sec = (lastAI?.gen?.secs_per || 30) * n;
  return `(${n}枚 · 約${sec < 3600 ? Math.ceil(sec / 60) + '分' : (sec / 3600).toFixed(1) + '時間'})`;
}
async function runGenNow() {
  const a = albumsCache.find(x => x.name === loc.key); if (!a) return;
  const batch = a.agent?.batch || 30;
  const n = Math.max(1, Math.min(batch, Math.max(batch, (a.agent?.target || 200) - (a.count || 0))));
  try {
    const r = await j('/api/gen', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({album: loc.key, n})});
    toast(`生成開始(+${n}枚目標) — 初回はモデル取得(7.1GB)とエンジン起動で数分かかります`);
    await loadAlbums(); renderViewhead();
  } catch (e) { toast('❌ ' + e.message); }
}

// 採用率は前回実績(無ければ15%)で割り戻す
function crawlCostEst(a) {
  if (!a?.agent?.boost) return '(無料)';
  const batch = a.agent?.batch || 30;
  const n = Math.max(1, Math.min(batch, Math.max(batch, (a.agent?.target || 200) - (a.count || 0))));
  const pass = Math.min(0.5, Math.max(0.05, a.last_run?.pass_rate || 0.15));
  const tok = (n / pass) * 1100 + 7000;
  const usd = (n / pass) * judgeRate(a) + 0.02; // 目利き単価はモデル連動+クエリ生成Claude約2¢
  return `(推定${fmtCost(tok, usd)})`;
}

// ================= ライトボックス表示の単一責任者(状態機械 2026-09-03全面整理) =================
// img#lbimg の src と表示サイズを書けるのはこのモジュールだけ。他は絶対に触らない(触ると今日の退行祭りが再演される)。
// 状態: gen(世代=画像が変わるたび++、遅延応答は世代不一致で全部捨てる) / tier(手元の最良: thumb→pv→full、render=編集焼き)
// サイズ規則: 通常=ビューポートへアスペクトフィット(小原本も拡大)、編集レンダ=自然寸法(クロップで比率が変わるため)
const lbView = {
  gen: 0, sha: null, tier: null, edited: false,
  // 表示箱。nw/nh=0で解除(自然寸法モード)
  box(nw, nh) {
    const img = $('lbimg');
    if (!nw || !nh) { img.removeAttribute('width'); img.removeAttribute('height'); return; }
    // 全画面(imm)中は画面いっぱい、通常はバー/メタの余白を残す
    const imm = $('lb').classList.contains('imm');
    const mw = imm ? innerWidth : innerWidth * .94;
    const mh = imm ? innerHeight : innerHeight * .74;
    const ar = nw / nh;
    let bw = Math.min(mw, mh * ar), bh = bw / ar;
    if (bh > mh) { bh = mh; bw = bh * ar; }
    img.width = Math.round(bw);
    img.height = Math.round(bh);
  },
  // 全画面切替などで箱だけ引き直す(中身はそのまま)
  refit() {
    const img = $('lbimg');
    if (this.tier === 'render') return; // 編集レンダは自然寸法のまま
    if (img.naturalWidth) this.box(img.naturalWidth, img.naturalHeight);
  },
  // 唯一のsrc書き込み口。デコード完了後に差し替える=空白フレームを出さない
  async apply(gen, url, tier, nw, nh) {
    if (gen !== this.gen) return;
    const pre = new Image();
    pre.src = url;
    try { if (pre.decode) await pre.decode(); } catch (e) {}
    if (gen !== this.gen) return;
    const img = $('lbimg');
    this.box(nw === undefined ? pre.naturalWidth : nw, nh === undefined ? pre.naturalHeight : nh);
    img.dataset.tier = tier;
    this.tier = tier;
    img.src = url;
    // 原寸昇格はpreviewが見えて一息ついてから(送り中の原寸DL乱発で回線を塞がない)
    if (tier === 'pv') {
      setTimeout(() => {
        if (gen !== this.gen || this.edited) return;
        const full = this._full = new Image();
        full.src = '/img/' + this.sha;
        full.onload = () => { if (gen === this.gen && !this.edited) this.apply(gen, full.src, 'full'); };
      }, 300);
    }
  },
  // 新しい画像: 箱は最初から最終サイズで確保し、サムネ→プレビュー→原寸を届いた順に同じ箱へ流し込む。
  // 押しっぱなし送り対策: 中間画像は120ms落ち着くまで一切読み込まず、進行中のDLは即中断
  // (中間の原寸DLが回線6本を塞ぎ「最初の画像が出続ける」実害 2026-09-03)
  show(it, dir, bust) {
    const gen = ++this.gen;
    this.sha = it.sha1; this.edited = false; this.tier = null;
    $('lbimg').dataset.tier = '';
    this.box(it.w, it.h);
    if (this._probe) { this._probe.onload = this._probe.onerror = null; this._probe.src = ''; }
    if (this._full) { this._full.onload = null; this._full.src = ''; }
    // サムネは常に即表示(30KB・グリッドでキャッシュ済み)=押しっぱなしでもパラパラ流れる
    this.apply(gen, tierUrl(it, 'thumb'), 'thumb', it.w, it.h);
    const start = () => {
      if (gen !== this.gen) return; // もう次へ行った=重い読み込みはしない
      const pvUrl = tierUrl(it, 'preview', bust);
      const probe = this._probe = new Image();
      probe.src = pvUrl;
      if (probe.complete) this.apply(gen, pvUrl, 'pv');
      else probe.onload = () => this.apply(gen, pvUrl, 'pv');
    };
    if (!dir) start(); else setTimeout(start, 120);
  },
  // 編集/マスク焼きレンダ(自然寸法)
  render(url) {
    this.edited = true;
    return this.apply(this.gen, url, 'render', 0, 0);
  },
};

  // 個別画像の同時decodeを避けるため1frame 24枚ずつ開始する。
  let i = 0;
  (function step() {
    if (gen !== retierVisible._gen) return;
    for (const {im, it, url} of individual.slice(i, i + 24)) {
      const pre = new Image();
      pre.decoding = 'async';
      pre.onload = () => {
        if (alive(im, it)) {

          im.dataset.tier = tier;
          im.removeAttribute('data-src');
          im.src = url;

      };
      pre.src = url;
    }
    i += 24;
    if (i < individual.length) requestAnimationFrame(step);
  })();
}

function lbCrossfade(src) {
  const img = $('lbimg');
  const pv = new Image();
  pv.src = src;
  const apply = () => {
    if (!$('lb').classList.contains('show')) { img.src = src; return; }
    const r = img.getBoundingClientRect();
    if (!r.width) { img.src = src; return; }
    const ghost = img.cloneNode();
    Object.assign(ghost.style, {
      position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px',
      margin: 0, zIndex: 39, pointerEvents: 'none', maxWidth: 'none', maxHeight: 'none',
      transition: 'opacity .38s ease',
    });
    document.body.appendChild(ghost);
    img.src = src;
    requestAnimationFrame(() => ghost.style.opacity = '0');
    setTimeout(() => ghost.remove(), 420);
  };
  if (pv.complete) apply(); else { pv.onload = apply; pv.onerror = () => { img.src = src; }; }
}

let segDrag = null;
function segBindPointer() {
  const img = $('lbimg');
  img.addEventListener('click', e => { if (lbSegOn) { e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  img.addEventListener('mousedown', e => {
    if (!lbSegOn || e.button !== 0) return;
    e.preventDefault(); e.stopImmediatePropagation();
    segDrag = {x: e.clientX, y: e.clientY, moved: false};
  }, true);
  addEventListener('mousemove', e => {
    if (!segDrag) return;
    if (Math.abs(e.clientX - segDrag.x) + Math.abs(e.clientY - segDrag.y) > 8) segDrag.moved = true;
    if (segDrag.moved) drawSegRect(e);
  });
  addEventListener('mouseup', e => {
    if (!segDrag) return;
    const d = segDrag; segDrag = null; $('segrect')?.remove();
    const r = img.getBoundingClientRect();
    if (!r.width) return;
    const nx = v => Math.min(1, Math.max(0, v));
    if (d.moved) {
      segRefine({box: [nx((Math.min(d.x, e.clientX) - r.left) / r.width), nx((Math.min(d.y, e.clientY) - r.top) / r.height),
                       nx((Math.max(d.x, e.clientX) - r.left) / r.width), nx((Math.max(d.y, e.clientY) - r.top) / r.height)]});
    } else {
      segRefine({points: [[nx((e.clientX - r.left) / r.width), nx((e.clientY - r.top) / r.height)]], labels: [1]});
    }
  });
  img.addEventListener('contextmenu', e => {
    if (!lbSegOn) { const sha = items[lbIdx]?.sha1; if (sha) ctxMenu(e, 'image', sha); return; } // 通常時=画像メニュー(保存/zip/…)
    e.preventDefault(); e.stopImmediatePropagation();
    const r = img.getBoundingClientRect();
    segDelAt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  }, true);
}
function drawSegRect(e) {
  let el = $('segrect');
  if (!el) {

    document.body.appendChild(el);
  }
  el.style.left = Math.min(segDrag.x, e.clientX) + 'px';
  el.style.top = Math.min(segDrag.y, e.clientY) + 'px';
  el.style.width = Math.abs(e.clientX - segDrag.x) + 'px';
  el.style.height = Math.abs(e.clientY - segDrag.y) + 'px';
}

    objectFit: 'cover', borderRadius: '10px', margin: 0, zIndex: 40, pointerEvents: 'none',

let zm = 1, zx = 0, zy = 0;
function zApply(anim) {
  const el = $('lbimg');
  el.style.transition = anim ? 'transform .22s ease, filter .18s ease' : 'filter .18s ease';
  el.style.transform = zm > 1.01 ? `translate(${zx}px,${zy}px) scale(${zm})` : '';
  el.style.cursor = zm > 1.01 ? 'grab' : 'zoom-out';
}
function zReset() { zm = 1; zx = zy = 0; zApply(false); }
{
  const el = $('lbimg');
  let clickTimer = null, downAt = null, movedFar = false;
  el.addEventListener('click', e => {
    e.stopPropagation();
    // クロップ確定のpointerup直後に飛んでくるclickで閉じない(「クロップすると画面ごと消える」退行の真因 2026-09-03)
    if (cropEnded) { cropEnded = false; return; }
    if (cropMode || movedFar) return;
    clearTimeout(clickTimer);
    clickTimer = setTimeout(() => {
      if (zm > 1.01) { zm = 1; zx = zy = 0; zApply(true); } // 拡大中→等倍
      else closeLb();                                        // 等倍→閉じる
    }, 230);
  });
  el.addEventListener('dblclick', e => {
    e.preventDefault(); clearTimeout(clickTimer);
    zm = zm > 1.01 ? 1 : 2.5; zx = zy = 0; zApply(true);
  });
  el.addEventListener('wheel', e => {
    e.preventDefault();
    zm = Math.min(8, Math.max(1, zm * (e.deltaY < 0 ? 1.25 : 0.8)));
    if (zm <= 1.01) { zx = zy = 0; }
    zApply(true);
  }, {passive: false});
  const pts = new Map();
  let panFrom = null, pinchFrom = null;
  el.addEventListener('pointerdown', e => {
    if (cropMode) { e.preventDefault(); el.setPointerCapture(e.pointerId); cropDown(e); return; }
    pts.set(e.pointerId, e); el.setPointerCapture(e.pointerId);
    downAt = {x: e.clientX, y: e.clientY}; movedFar = false;
    if (pts.size === 1 && zm > 1.01) panFrom = {x: e.clientX - zx, y: e.clientY - zy};
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinchFrom = {d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), zm};
      panFrom = null;
    }
  });
  el.addEventListener('pointermove', e => {
    if (cropMode) { cropMove(e); return; }
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) movedFar = true;
    if (pts.size === 2 && pinchFrom) {
      const [a, b] = [...pts.values()];
      zm = Math.min(8, Math.max(1, pinchFrom.zm * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinchFrom.d));
      zApply(false);
    } else if (panFrom && zm > 1.01) {
      zx = e.clientX - panFrom.x; zy = e.clientY - panFrom.y;
      zApply(false);
    }
  });
  ['pointerup', 'pointercancel'].forEach(ev => el.addEventListener(ev, e => {
    if (cropMode) { cropUp(e); return; }
    pts.delete(e.pointerId);
    if (pts.size < 2) pinchFrom = null;
    if (!pts.size) panFrom = null;
    if (zm <= 1.01) { zx = zy = 0; zApply(true); }
  }));
}

// ✂ クロップ: ドラッグで範囲→離した瞬間に確定(比率で送るので回転後でも正しい)
let cropMode = false, cropStart = null, cropEnded = false; // cropEnded=確定直後のclickを1回飲む印
function cropToggle() {
  cropMode = !cropMode;
  $('cropbtn').classList.toggle('on', cropMode);
  $('lbimg').style.cursor = cropMode ? 'crosshair' : '';
  if (!cropMode) $('croprect').style.display = 'none';
  toast(cropMode ? '画像の上をドラッグして範囲指定 → 離すと確定' : 'クロップをやめました');
}
function cropDown(e) {
  cropStart = {x: e.clientX, y: e.clientY};
  const r = $('croprect');
  r.style.display = 'block';
  Object.assign(r.style, {left: e.clientX + 'px', top: e.clientY + 'px', width: '0px', height: '0px'});
}
function cropMove(e) {
  if (!cropStart) return;
  const r = $('croprect');
  Object.assign(r.style, {
    left: Math.min(cropStart.x, e.clientX) + 'px', top: Math.min(cropStart.y, e.clientY) + 'px',
    width: Math.abs(e.clientX - cropStart.x) + 'px', height: Math.abs(e.clientY - cropStart.y) + 'px'});
}
function cropUp(e) {
  if (!cropStart) return;
  const img = $('lbimg').getBoundingClientRect();
  const x0 = Math.max(img.left, Math.min(cropStart.x, e.clientX));
  const y0 = Math.max(img.top, Math.min(cropStart.y, e.clientY));
  const x1 = Math.min(img.right, Math.max(cropStart.x, e.clientX));
  const y1 = Math.min(img.bottom, Math.max(cropStart.y, e.clientY));
  cropStart = null;
  cropEnded = true; // 直後のclickは閉じ操作にしない
  $('croprect').style.display = 'none';
  const fw = (x1 - x0) / img.width, fh = (y1 - y0) / img.height;
  if (fw < 0.05 || fh < 0.05) return toast('範囲が小さすぎます');
  cropToggle();
  edPush({op: 'crop', params: {
    fx: +((x0 - img.left) / img.width).toFixed(4), fy: +((y0 - img.top) / img.height).toFixed(4),
    fw: +fw.toFixed(4), fh: +fh.toFixed(4)}});
}

// 削除アニメ: 対象はしゅっと縮み、残った子はFLIPで隙間に流れ込む(全再描画=黒画面をやめる)
function removeCellsAnimated(shas) {
  const old = {};
  document.querySelectorAll('.cell').forEach(el => { old[el.id] = el.getBoundingClientRect(); });
  let n = 0;
  shas.forEach(s => {
    const el = $('c_' + s);
    if (!el) return;
    n++;
    el.style.pointerEvents = 'none';
    el.animate([{opacity: 1, transform: 'scale(1)'}, {opacity: 0, transform: 'scale(.55)'}],
               {duration: 180, easing: 'ease-in'}).onfinish = () => {
      el.remove();
      if (--n === 0) requestAnimationFrame(() => {
        document.querySelectorAll('.cell').forEach(e2 => {
          const o = old[e2.id]; if (!o) return;
          const r2 = e2.getBoundingClientRect();
          const dx = o.left - r2.left, dy = o.top - r2.top;
          if (dx || dy) e2.animate([{transform: `translate(${dx}px,${dy}px)`}, {transform: 'none'}],
            {duration: 420, easing: 'cubic-bezier(.2,.9,.3,1)'});
        });
      });
    };
  });
  if (n === 0) render(true);
  drawSelbar();
}

// ライトボックス削除は楽観方式: 押した瞬間にUIから消して次を表示し、サーバへは裏で直列バッチ送信。
// 旧方式(サーバ応答待ち→次表示)は、応答が詰まると連打が同一画像への空撃ちになり
// 「そのうち消せなくなる」実害(2026-09-03 連打再現テストで確認: 25連打中8枚のみ削除+完全スタック)
const delQueue = [];
let delPumping = false;
async function pumpDel() {
  if (delPumping) return; delPumping = true;
  try {
    while (delQueue.length) {
      const batch = delQueue.splice(0); // 溜まった分をまとめて1リクエスト
      try {
        const r = await j('/api/trash', {method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({shas: batch})});
        lastTrashed = lastTrashed.concat(batch);
        toast(`${lastTrashed.length}枚をゴミ箱へ(30日は戻せます)`, '元に戻す', undoTrash);
      } catch (e) { toast('❌ 削除失敗(' + batch.length + '枚): ' + e.message); }
    }
    refreshFacets();
  } finally { delPumping = false; }
}
function lbDel() {
  const it = items[lbIdx]; if (!it) return;
  const i = lbIdx;
  $('lbimg').animate([{transform: 'none', opacity: 1}, {transform: 'scale(.85)', opacity: 0}],
                     {duration: 160, easing: 'ease-in'}); // 消える手応え
  if (!delQueue.length && !delPumping) lastTrashed = []; // 新しい削除セッションの開始
  items = items.filter(x => x.sha1 !== it.sha1);
  total = Math.max(0, total - 1);
  sel.delete(it.sha1);
  removeCellsAnimated([it.sha1]);
  delQueue.push(it.sha1);
  pumpDel();
  if (!items.length) closeLb();
  else lbShow(Math.min(i, items.length - 1), 1);
}

async function liveDrop(album, n, prefix = 'crawl:') {

    (loc.type === 'source' && loc.key === prefix + album);

    if (anchor && !anchor.atTop) {
      anchor.index += fresh.length;
      restoreCellAnchor(anchor, false);

    if (vStart === 0) { // 先頭が見えている時だけ「ぽとっ」と落ちる演出
      [...$('grid').children].slice(0, fresh.length).forEach((el, k) => {

// ---- 内蔵/外部AIの準備状況(/api/activity の ai)。「どのAIが使える状態か」をAI配役とサイドバーに出す ----
var lastAI = null; // varとfunction: 起動時のfolderHeadHtml/fsSyncより後に定義されるので巻き上げが要る
var _eta = {};
// 進捗の速度から残り時間。「あとどれくらいか分からないと不安」への回答(DL/属性付け/取込に共通)
function eta(key, done, total) {
  const now = Date.now(), p = _eta[key];
  const inst = p ? (done - p.v) / Math.max(0.5, (now - p.t) / 1000) : 0;
  const rate = p && p.rate > 0 ? p.rate * 0.7 + inst * 0.3 : inst;
  if (!p || done !== p.v) _eta[key] = {t: now, v: done, rate};
  const r = (_eta[key] || {}).rate;
  if (!(r > 0) || !(total > done)) return '';
  const sec = (total - done) / r;
  return ' · 残り' + (sec < 60 ? `${Math.ceil(sec)}秒` : sec < 3600 ? `約${Math.ceil(sec / 60)}分` : `約${(sec / 3600).toFixed(1)}時間`);
}
function aiMarkHtml(k) {
  const A = lastAI; if (!A) return '';

  const ng = (t, act) => ` <span style="color:#e06c75" title="${esc(t)}">✗ ${esc(t)}</span>${act || ''}`;
  const dl = (x, key) => ` <span style="color:#e0a83c">DL ${Math.round(100 * x.got_mb / (x.total_mb || 1))}%${eta(key, x.got_mb, x.total_mb)}</span>`;
  const pull = (kind, mb) => ` <button class="ghost" style="font-size:11px; padding:1px 6px" onclick="aiPull('${kind}')" title="この場でダウンロード(初回のみ)">取得 ${mb}</button>`;
  switch (k) {
    case 'llm': return A.llm.present ? ok(A.llm.ready ? '常駐中' : '取得済') : A.llm.downloading ? dl(A.llm, 'llm') : ng('未取得', pull('llm', '2.4GB'));
    case 'clip': return A.clip.present ? ok('モデルあり') : A.clip.downloading ? dl(A.clip, 'clip') : ng('未取得', pull('clip', '350MB'));
    case 'vlm': {
      const L = A.vlm.local || {};
      if (A.vlm.backend === 'llama-server') return ok('内蔵VLM 稼働中(' + (L.model || '') + ')');
      if (L.downloading) return dl(L, 'vlm');
      if (L.starting) return ` <span style="color:#e0a83c">起動中…</span>`;
      if (L.bin) return L.present ? ng('内蔵VLM 停止中', pull('vlm', '起動')) : ng('未取得', pull('vlm', '3.3GB'));
      return A.vlm.present ? ok('ollama接続OK') : A.vlm.reachable ? ng('モデル未取得(初回に自動pull)') : ng('llama-server なし・ollama未起動');
    }
    case 'seg': return A.seg.reachable ? ok('ml-hub接続OK') : ng('ml-hub未接続');
    case 'gen': {
      const G = A.gen || {};
      if (G.external) return ok('外部 sd-server: ' + G.external);
      if (G.downloading) return dl(G, 'gen');
      if (G.starting) return ` <span style="color:#e0a83c">起動中…</span>`;

document.addEventListener('keydown', e => {

  if (e.key === '/') { e.preventDefault(); $('q').focus(); return; }

              : e.key === 'ArrowUp' ? -gridCols() : gridCols();

  else if (e.key === 'ArrowRight' || e.key === 'f') lbGo(1);
  else if (e.key === 'ArrowLeft' || e.key === 'd') lbGo(-1);
